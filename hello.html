<!--
  꽃 인사(11/2 다시 만듦). 사진을 보내는 게 아니라 '링크'가 돌아야 이어진다.
  - 보내기: 카톡 메시지(카카오 공유 feed)에 버튼 둘 — '꽃말 보기'(받은 화면) · '나도 보내기'(만들기 화면).
    키(KAKAO_JS_KEY)가 없으면 폰 공유 창에 글+링크만(kakao-share.js).
  - 링크: /hello?s=<상황>&g=<인사 번호> 또는 &m=<직접 쓴 말 24자>&n=<보내는 분 10자>&d=<YYYYMMDD>[&make=1]
    이름·한마디는 받는 분 화면에 보여야 해서 링크에 담는다(화면에 그렇게 안내).
  - 받은 화면: 누가 보냈는지 · 카드 · 꽃말 · '나도 꽃 인사 보내기' · '꽃 선물하기'(선물 스위치가 켜지면 카톡 선물로).
  지킬 것: 꽃말은 사이트 원본 문구만, 근조·국화·흰 꽃 금지, 카드·메시지에 가격 금지, 보내기만으로 포인트 주지 않음.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--kakao:#FEE500;--serif:"Gowun Batang",serif}
  body{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif);background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px}
  [hidden]{display:none !important}
  .hd{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:1040px;margin:0 auto}
  .hd a{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--ink);text-decoration:none}
  .hd span{font-size:13px;color:var(--ink-soft)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px 130px;display:grid;gap:18px}
  .ttl h1{font-family:var(--serif);font-size:24px;line-height:1.35;word-break:keep-all}
  .ttl p{font-size:14.5px;color:var(--ink-soft);margin-top:4px;word-break:keep-all}
  .card{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
  .lbl{display:block;font-size:16px;font-weight:700;margin:2px 0 8px}
  .lbl small{font-weight:400;font-size:13px;color:var(--ink-soft)}
  .sits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .sit{min-height:48px;padding:0 4px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-weight:600;font-size:15px;font-family:inherit;cursor:pointer;word-break:keep-all}
  .sit.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pick{display:flex;flex-wrap:wrap;gap:6px}
  .pbtn{min-height:44px;padding:8px 13px;border:1px solid var(--line);border-radius:22px;background:var(--paper);color:var(--ink);font-weight:600;font-size:15px;line-height:1.35;font-family:inherit;text-align:left;cursor:pointer}
  .pbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .inp{width:100%;min-height:50px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:17px;font-family:inherit;color:var(--ink)}
  .inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .cnt{font-size:12.5px;color:var(--ink-faint);text-align:right;margin-top:4px}
  .note{font-size:13px;color:var(--ink-faint);margin-top:6px;word-break:keep-all}
  .mean{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;scroll-margin-top:12px}
  .mean .k{font-size:13px;color:var(--ink-soft)}
  .mean b{display:block;font-family:var(--serif);font-size:22px;margin:2px 0 4px}
  .mean p{font-family:var(--serif);font-size:17px;line-height:1.7;word-break:keep-all}
  .mean small{display:block;margin-top:8px;font-size:12.5px;color:var(--ink-faint)}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
  .bar-in{max-width:520px;margin:0 auto;display:grid;gap:6px}
  .kbtn{display:flex;width:100%;min-height:56px;align-items:center;justify-content:center;gap:7px;border:0;border-radius:10px;background:var(--kakao);color:#191600;font-weight:800;font-size:17px;font-family:inherit;cursor:pointer;text-decoration:none}
  .gbtn{display:flex;width:100%;min-height:56px;align-items:center;justify-content:center;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;font-size:17px;font-family:inherit;cursor:pointer;text-decoration:none}
  .obtn{display:flex;flex-direction:column;width:100%;min-height:56px;align-items:center;justify-content:center;border:1.5px solid var(--accent);border-radius:10px;background:var(--paper);color:var(--accent-deep);font-weight:800;font-size:16px;font-family:inherit;text-decoration:none;line-height:1.3}
  .obtn small{font-weight:500;font-size:12.5px;color:var(--ink-soft)}
  .lnk{border:0;background:none;color:var(--ink-soft);font-weight:500;font-size:15px;font-family:inherit;cursor:pointer;min-height:40px;text-decoration:underline;justify-self:center}
  .toast{min-height:20px;font-size:13.5px;text-align:center;color:var(--accent-deep)}
  .foot{font-size:12.5px;color:var(--ink-faint);text-align:center;line-height:1.7}
  .col{display:grid;gap:18px;align-content:start;min-width:0}
  /* 컴퓨터: 카드 왼쪽, 나머지 오른쪽. 아래 고정 바 대신 오른쪽 칸 안에 */
  @media (min-width:900px){
    .wrap{grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:36px;align-items:start;padding-bottom:48px}
    .ttl,.foot{grid-column:1/-1}
    .stick{position:sticky;top:16px}
    .bar{position:static;border:0;padding:0;background:none}
    .bar-in{max-width:none}
  }
</style>

<body>
<header class="hd"><a href="/">꽃안부</a><span id="today"></span></header>
<main class="wrap">
  <div class="ttl"><h1 id="h1">꽃 인사 보내기</h1><p id="sub">오늘의 꽃에 한마디 적어 단톡방에 보내요. 가입 없이 무료예요.</p></div>
  <div class="stick"><canvas class="card" id="card" width="1080" height="1350" role="img" aria-label="꽃 인사 카드"></canvas></div>

  <!-- 받은 화면 -->
  <div class="col" id="recv" hidden>
    <section class="mean" id="m"><span class="k" id="mDay"></span><b id="mName"></b><p id="mSay"></p><small>널리 전해지는 꽃말이에요</small></section>
    <div class="bar"><div class="bar-in">
      <button class="gbtn" id="meToo" type="button">나도 꽃 인사 보내기</button>
      <a class="obtn" id="giftBtn" href="/catalog.html?cat=basket"><span id="giftT">진짜 꽃 선물하기</span><small id="giftS">사장님이 직접 만들어 보내 드려요</small></a>
    </div></div>
  </div>

  <!-- 만들기 화면 -->
  <div class="col" id="make" hidden>
    <div><label class="lbl" for="who">보내는 분 이름 <small>(받는 분께 보여요)</small></label>
      <input class="inp" id="who" type="text" maxlength="10" autocomplete="nickname" placeholder="예: 막내 수진"></div>
    <div><span class="lbl">어떤 카드를 보낼까요</span><div class="sits" id="sits"></div></div>
    <div><span class="lbl">한마디 고르기</span><div class="pick" id="greets"></div></div>
    <div><label class="lbl" for="msg">직접 쓰기 <small>(쓰면 고른 말 대신 들어가요)</small></label>
      <input class="inp" id="msg" type="text" maxlength="24" autocomplete="off" placeholder="예: 오늘도 힘내세요"><div class="cnt" id="msgCnt">0/24</div></div>
    <p class="note">이름과 한마디는 링크에 담겨 받는 분 화면과 카톡 미리보기에 보여요. 받는 분도 바로 이어서 보낼 수 있어요.</p>
    <div class="bar"><div class="bar-in">
      <button class="kbtn" id="send" type="button"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#191600" d="M12 3C6.5 3 2 6.5 2 10.8c0 2.8 1.9 5.2 4.7 6.6l-1 3.7c-.1.3.3.6.6.4l4.4-2.9c.4 0 .8.1 1.3.1 5.5 0 10-3.5 10-7.9S17.5 3 12 3z"/></svg>카톡으로 보내기</button>
      <button class="lnk" id="copy" type="button">링크 복사</button>
      <p class="toast" id="toast" role="status"></p>
    </div></div>
  </div>
  <p class="foot">꽃말은 널리 전해지는 이야기예요. 가입 없이 무료로 보낼 수 있어요.</p>
</main>
<script>
(function(){
var FLOWERS=[
  {key:"rose",name:"장미",say:"붉은 장미는 사랑, 분홍은 고마움을 뜻한다고 전해져요"},
  {key:"tulip",name:"튤립",say:"봄에 가장 먼저 마음을 전하는 꽃이라고들 해요"},
  {key:"carnation",name:"카네이션",say:"감사와 사랑을 전하는 꽃으로 오래 쓰여 왔어요"},
  {key:"orchid",name:"호접란",say:"나비가 날아오는 모습을 닮아 좋은 소식이 찾아온다는 뜻으로 전해져요"},
  {key:"sunflower",name:"해바라기",say:"한결같이 한 곳을 바라보는 마음을 뜻한대요"},
  {key:"hydrangea",name:"수국",say:"여러 송이가 모여 한 덩이가 되어 진심을 뜻한다고 전해져요"},
  {key:"gerbera",name:"거베라",say:"언제나 밝게 웃는 마음을 닮았다고 해요"}
];
// 절기(해마다 하루쯤 달라질 수 있어 연도별로 적는다)
var TERMS={"2026-11-07":"입동","2026-11-22":"소설","2026-12-07":"대설","2026-12-22":"동지","2027-01-05":"소한","2027-01-20":"대한","2027-02-04":"입춘","2027-02-19":"우수","2027-03-06":"경칩","2027-03-21":"춘분"};
var SEASONS={
  "봄":{flower:"tulip",tint:"#fdf1f2",g:["꽃 피는 봄입니다. 나들이 가세요.","춘곤증 조심하세요. 낮잠은 괜찮습니다.","봄바람이 셉니다. 모자 잘 붙드세요."]},
  "여름":{flower:"hydrangea",tint:"#eef5f9",g:["더위 조심하세요. 물 많이 드세요.","에어컨 끄지 마세요. 전기세보다 건강입니다.","복날입니다. 닭은 드셨습니까."]},
  "가을":{flower:"sunflower",tint:"#fbf2e6",g:["하늘이 높습니다. 고개 한번 드세요.","환절기입니다. 겉옷 챙기세요.","단풍 구경은 다녀오셨습니까."]},
  "겨울":{flower:"orchid",tint:"#eef1f5",g:["날이 찹니다. 내복 챙기세요.","빙판길 조심하세요. 천천히 가셔도 됩니다.","감기 조심하세요."]}
};
// 1단계 네 가지. 생신·힘내세요·명절·내 사진은 반응을 본 뒤에 연다(시안 '순서').
var SITS=[
  {k:"daily",t:"오늘의 꽃",g:["좋은 아침입니다","오늘도 건강하세요","좋은 하루 보내세요","식사 잘 챙기세요","평안한 밤 되세요"]},
  {k:"fun",t:"웃긴 안부",g:["약 드셨습니까. 꽃은 물만 먹어도 됩니다.","허리 펴세요. 꽃도 보고 있습니다.","꽃은 밥을 안 줘도 됩니다. 사람은 먹어야 합니다.","오늘 안 웃으시면 꽃이 먼저 웃습니다.","자식 걱정 그만하시고 꽃이나 보세요.","전화 한 통이면 됩니다. 꽃은 말을 못 합니다."]},
  {k:"season",t:"계절 인사"},
  {k:"thanks",t:"고마움",flower:"hydrangea",label:"고마운 분께",g:["늘 고맙습니다","덕분에 잘 지냅니다","별일 없으시지요","보고 싶습니다"]}
];
var SERIF='"Gowun Batang",serif', SANS='-apple-system,"Apple SD Gothic Neo",sans-serif';
var DAYS=["일","월","화","수","목","금","토"], CREAM="#f6f6f3";
var $=function(i){return document.getElementById(i)};
var imgs={};

function kstNow(){ var d=new Date(Date.now()+9*3600e3); return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),12); }
function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function ymd(d){ return iso(d).replace(/-/g,""); }
function parseYmd(s){ var m=/^(\d{4})(\d{2})(\d{2})$/.exec(s||""); if(!m) return null; var d=new Date(+m[1],+m[2]-1,+m[3],12); return isNaN(d)?null:d; }
function flowerOf(d){ var n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); return FLOWERS[((n%FLOWERS.length)+FLOWERS.length)%FLOWERS.length]; }
function byKey(k){ return FLOWERS.filter(function(f){return f.key===k})[0]||FLOWERS[0]; }
function sitOf(k){ return SITS.filter(function(x){return x.k===k})[0]||SITS[0]; }
function seasonOf(d){ var md=(d.getMonth()+1)*100+d.getDate(); return md>=1107||md<204?"겨울":md<505?"봄":md<807?"여름":"가을"; }
function solar(d){ return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+DAYS[d.getDay()]+"요일"; }
function lunar(d){
  try{ var p=new Intl.DateTimeFormat("ko-KR-u-ca-chinese",{month:"numeric",day:"numeric",timeZone:"Asia/Seoul"}).format(d).match(/\d+/g);
    return p&&p.length>=2?"음력 "+p[0]+"월 "+p[1]+"일":""; }catch(e){ return ""; }
}
function dateLine(d){ var t=TERMS[iso(d)]; if(t) return solar(d)+", 오늘은 "+t; var l=lunar(d); return l?solar(d)+", "+l:solar(d); }
function greetsOf(st){ return st.sit==="season"?SEASONS[seasonOf(st.d)].g:(sitOf(st.sit).g||[]); }

function resolve(){
  var d=st.d, f=flowerOf(d), S=sitOf(st.sit);
  var r={f:f,greet:st.greet,who:st.who,label:dateLine(d),tint:CREAM,title:"오늘의 꽃 "+f.name};
  if(st.sit==="fun") r.title="꽃 안부";
  if(st.sit==="season"){ var se=seasonOf(d), X=SEASONS[se]; r.f=byKey(X.flower); r.tint=X.tint; r.label=se+" 인사"; r.title=se+" 인사"; }
  if(S.flower){ r.f=byKey(S.flower); r.label=S.label; r.title=S.label; if(S.tint) r.tint=S.tint; }
  return r;
}
function wrap(c,text,max){ var out=[],line=""; text.split(" ").forEach(function(w){ var t=line?line+" "+w:w; if(c.measureText(t).width<=max){line=t;return;} if(line) out.push(line); line=w; }); if(line) out.push(line); return out; }
function greetFit(c,text,W){
  var parts=text.split(/\.\s+/);
  var lines=parts.length>1?parts.map(function(p,i){return i<parts.length-1?p+".":p;}):[text];
  var size=lines.length>1?66:84;
  var widest=function(){ return Math.max.apply(null,lines.map(function(l){return c.measureText(l).width})); };
  c.font="700 "+size+"px "+SERIF;
  while(widest()>W&&size>52){ size-=2; c.font="700 "+size+"px "+SERIF; }
  if(widest()>W) lines=wrap(c,text,W);
  return {lines:lines,size:size};
}
function cover(c,im,x,y,w,h){ var iw=im.naturalWidth||im.width, ih=im.naturalHeight||im.height, k=Math.max(w/iw,h/ih), sw=w/k, sh=h/k; c.drawImage(im,(iw-sw)/2,(ih-sh)/2,sw,sh,x,y,w,h); }
function paint(c,s){
  var P=72,W=1080-P*2, ink="#1f1d18", soft="#5a564d", brand="#1f4733";
  c.fillStyle=s.tint; c.fillRect(0,0,1080,1350); c.textAlign="center"; c.textBaseline="alphabetic";
  var G=s.greet?greetFit(c,s.greet,W):null, two=G&&G.lines.length>1, ph=two?740:840;
  if(imgs[s.f.key]&&imgs[s.f.key].complete) cover(c,imgs[s.f.key],0,0,1080,ph); else { c.fillStyle="#e4e1d8"; c.fillRect(0,0,1080,ph); }
  var dy=two?806:908, ny=two?1046:1076, sy=two?1100:1130, wy=two?1232:1250;
  c.fillStyle=soft; c.font="500 38px "+SANS; c.fillText(s.label,540,dy);
  if(G){
    c.font="700 "+G.size+"px "+SERIF; c.fillStyle=ink;
    G.lines.slice(0,2).forEach(function(l,i){ c.fillText(l,540,two?896+i*80:1004); });
    c.font="700 42px "+SERIF; c.fillText(s.f.name,540,ny);
    c.font="400 38px "+SERIF; c.fillStyle=soft; wrap(c,s.f.say,W).slice(0,2).forEach(function(l,i){ c.fillText(l,540,sy+i*52); });
  }else{
    c.font="700 96px "+SERIF; c.fillStyle=ink; c.fillText(s.f.name,540,1018);
    c.font="400 44px "+SERIF; c.fillStyle=soft; wrap(c,s.f.say,W).slice(0,2).forEach(function(l,i){ c.fillText(l,540,1094+i*60); });
  }
  if(s.who){ c.font="700 46px "+SERIF; c.fillStyle=ink; c.fillText(s.who+" 드림",540,wy); }
  c.textAlign="left"; c.font="400 26px "+SANS; c.fillStyle=soft; c.fillText("널리 전해지는 꽃말",P,1312);
  c.textAlign="right"; c.font="700 34px "+SERIF; c.fillStyle=brand; c.fillText("꽃안부 floweranbu.co.kr",1080-P,1312);
}
function loadImg(k){ if(imgs[k]) return imgs[k].ready; var im=new Image(); imgs[k]=im; im.ready=new Promise(function(res){ im.onload=res; im.onerror=res; }); im.src="/photos/hello/"+k+".jpg"; return im.ready; }
var drawId=0;
function draw(){
  var id=++drawId, s=resolve();
  var txt=[s.greet,s.who,s.f.name,s.f.say,s.label,"드림 꽃안부 널리 전해지는 꽃말"].join(" ");
  var fonts=document.fonts&&document.fonts.load?Promise.all(["700 80px "+SERIF,"400 40px "+SERIF].map(function(f){return document.fonts.load(f,txt).catch(function(){})})):Promise.resolve();
  return Promise.all([fonts,loadImg(s.f.key)]).then(function(){ if(id===drawId) paint($("card").getContext("2d"),s); });
}

// ── 링크에서 읽기 ──
var q=new URLSearchParams(location.search), today=kstNow();
function clean(v,n){ return String(v||"").replace(/[\u0000-\u001f\u007f<>]/g,"").replace(/\s+/g," ").trim().slice(0,n); }
var st={sit:sitOf(q.get("s")).k, greet:"", msg:"", who:"", d:today};
var got=!!q.get("s") && q.get("make")!=="1";
if(q.get("s")){
  var gd=parseYmd(q.get("d")); if(gd) st.d=gd;
  var gi=parseInt(q.get("g"),10), list=greetsOf(st); if(gi>=0&&gi<list.length) st.greet=list[gi];
  st.msg=clean(q.get("m"),24); st.who=clean(q.get("n"),10);
}
// 카드에 들어갈 말: 직접 쓴 말이 고른 말보다 먼저
function line(){ return st.msg||st.greet; }
var _resolve=resolve; resolve=function(){ var r=_resolve(); r.greet=line(); return r; };

function renderSits(){
  var box=$("sits"); box.innerHTML="";
  SITS.forEach(function(x){ var b=document.createElement("button"); b.type="button"; b.className="sit"+(st.sit===x.k?" on":""); b.textContent=x.t;
    b.onclick=function(){ st.sit=x.k; st.greet=""; renderPick(); renderSits(); draw(); }; box.appendChild(b); });
}
function renderPick(){
  var box=$("greets"); box.innerHTML="";
  // 비워 두면 카드가 꽃 이름만 남아 허전하다(11/3 형구) → 그 상황의 첫 인사를 기본으로
  var L=greetsOf(st); if(!st.msg && L.indexOf(st.greet)<0) st.greet=L[0]||"";
  greetsOf(st).forEach(function(g){ var b=document.createElement("button"); b.type="button"; b.className="pbtn"+(st.greet===g&&!st.msg?" on":""); b.textContent=g;
    b.onclick=function(){ st.greet=g; st.msg=""; $("msg").value=""; $("msgCnt").textContent="0/24"; renderPick(); draw(); }; box.appendChild(b); });
}
function shareUrl(){
  var gi=st.msg?-1:greetsOf(st).indexOf(st.greet);
  var p="s="+st.sit+(gi>=0?"&g="+gi:"")+(st.msg?"&m="+encodeURIComponent(st.msg):"")+(st.who?"&n="+encodeURIComponent(st.who):"")+"&d="+ymd(st.d);
  return location.origin+"/hello?"+p;
}
var toastT; function toast(m){ $("toast").textContent=m; clearTimeout(toastT); toastT=setTimeout(function(){ $("toast").textContent=""; },3500); }
function message(){
  var s=resolve(), url=shareUrl();
  var title=st.who?st.who+"님이 꽃 인사를 보냈어요":"꽃 인사가 도착했어요";
  return { title:title, desc:(line()?line()+" · ":"")+"오늘의 꽃 "+s.f.name, image:"/photos/hello/"+s.f.key+".jpg", url:url,
    buttons:[{title:"꽃말 보기",url:url+"#m"},{title:"나도 보내기",url:url+"&make=1"}],
    text:title+(line()?" · "+line():"") };
}
function needName(){
  if(st.who) return false;
  var el=$("who"); el.focus(); if(el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"center"});
  toast("보내는 분 이름을 적어 주세요. 누가 보냈는지 받는 분께 보여요."); return true;
}
$("send").onclick=function(){
  if(needName()) return;
  if(!window.afKakao){ toast("잠시 뒤 다시 눌러 주세요."); return; }
  afKakao.send(message()).then(function(r){ if(r==="copied") toast("복사했어요. 카톡 대화방에 붙여 넣어 주세요."); });
};
$("copy").onclick=function(){
  if(needName()) return;
  var m=message(), t=m.text+"\n"+m.url;
  (window.afKakao?afKakao.copy(t):Promise.resolve()).then(function(r){ if(r==="copied") toast("복사했어요. 카톡 대화방에 붙여 넣어 주세요."); });
};
$("msg").oninput=function(e){ st.msg=clean(e.target.value,24); $("msgCnt").textContent=e.target.value.length+"/24"; renderPick(); draw(); };
$("who").oninput=function(e){ st.who=clean(e.target.value,10); try{ localStorage.setItem("af_hello_who",st.who); }catch(_){} draw(); };
function myName(){ try{ return clean(localStorage.getItem("af_hello_who"),10); }catch(_){ return ""; } }

// ── 화면 나누기 ──
function showMake(){
  // 나도 보내기: 보낸 분 이름·한마디는 지우고 오늘의 꽃으로 새로 만든다
  st.d=today; st.who=myName(); st.msg=""; st.greet=""; $("who").value=st.who; $("msg").value="";
  $("recv").hidden=true; $("make").hidden=false;
  $("h1").textContent="꽃 인사 보내기"; $("sub").textContent="오늘의 꽃에 한마디 적어 단톡방에 보내요. 가입 없이 무료예요.";
  renderSits(); renderPick(); draw();
}
function showRecv(){
  var s=resolve();
  $("make").hidden=true; $("recv").hidden=false;
  $("h1").textContent=st.who?st.who+"님이 꽃 인사를 보냈어요":"꽃 인사가 도착했어요";
  $("sub").textContent=iso(st.d)===iso(today)?"오늘의 꽃과 꽃말을 보내 주셨어요.":(st.d.getMonth()+1)+"월 "+st.d.getDate()+"일에 보낸 꽃이에요.";
  $("mDay").textContent=st.sit==="season"||sitOf(st.sit).flower?s.title:"오늘의 꽃";
  $("mName").textContent=s.f.name; $("mSay").textContent=s.f.say;
  draw();
  if(location.hash==="#m") setTimeout(function(){ var el=$("m"); if(el&&el.scrollIntoView) el.scrollIntoView({behavior:"smooth",block:"start"}); },300);
}
$("meToo").onclick=function(){
  try{ history.pushState({},"","/hello?s="+st.sit+"&make=1"); }catch(_){}
  showMake(); window.scrollTo({top:0,behavior:"smooth"});
};
// 꽃 선물: 카톡·링크 선물이 켜져 있으면 그쪽으로(footer.js 스위치)
document.addEventListener("DOMContentLoaded",function(){
  if(window.AF_GIFT_ENTRY){ $("giftBtn").href="/catalog.html?cat=basket&gift=1"; $("giftT").textContent="카톡으로 꽃 선물하기"; $("giftS").textContent="주소 몰라도 돼요. 받는 분이 직접 넣어요"; }
});
window.addEventListener("popstate",function(){ location.reload(); });

$("today").textContent=solar(today);
if(got) showRecv(); else { if(q.get("make")==="1"){ st.d=today; st.who=""; st.msg=""; } showMake(); }
})();
</script>
</body>
</html>
