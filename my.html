<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>내 정보 — 꽃안부</title>
<meta name="description" content="주문·배송 조회, 챙길 사람 생일·기념일, 내가 만든 부고장·청첩장을 한 곳에서 봐요.">

<link rel="stylesheet" href="/tokens.css">

<style>
  /* 내 정보(10/20 형구 A안) — 하단 탭 '내 정보'와 PC 메뉴 '주문·배송 조회'가 여기로 온다.
     탭 3개: 주문·배송 / 챙길 사람 / 내 안내장. 로그인 안 했으면 주문·배송 탭이 곧 주문번호 조회(예전 order-lookup.html).
     예전 계정 시트(auth.js)의 적립금·기념일·지난 주문을 이 페이지로 옮겼다. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.7; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px 80px; }
  header { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line-soft); margin: 0 -20px; padding: 14px 20px 10px; }
  .hdr-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--ink); text-decoration: none; }
  .hdr-tel { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; min-height: 48px; justify-content: center; padding: 4px 10px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--paper); text-decoration: none; }
  .hdr-tel .ht-num { font-family: var(--font-display); font-size: var(--fs-price); font-weight: 800; color: var(--accent-deep); white-space: nowrap; }
  .hdr-tel .ht-sub { font-size: var(--fs-label); color: var(--ink-faint); white-space: nowrap; }
  /* 계정 상단에 떠 있는 로그인 칩은 이 페이지에선 안 띄운다(이름 줄이 그 일을 한다) */
  .af-auth-chip { display: none !important; }
  h1 { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 700; margin: 22px 0 4px; }
  h2 { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin: 18px 0 4px; }
  .sub { font-size: var(--fs-sub); color: var(--ink-soft); margin: 0 0 14px; word-break: keep-all; }
  .me { display: flex; align-items: center; gap: 12px; margin: 18px 0 4px; }
  .me .av { width: 46px; height: 46px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-deep); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; flex: 0 0 auto; }
  .me .nm { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.3; }
  .me .em { font-size: var(--fs-caption); color: var(--ink-faint); word-break: break-all; }
  .me .out { margin-left: auto; border: 1px solid var(--line); background: var(--paper); color: var(--ink-soft); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .pts { display: inline-flex; gap: 6px; align-items: center; margin: 6px 0 2px; padding: 5px 12px; border-radius: 999px; background: #eef5ef; color: #14311f; font-size: 13.5px; font-weight: 700; }
  .ref { margin: 12px 0 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--paper); }
  .ref b { display: block; font-size: 15.5px; }
  .ref p { margin: 2px 0 10px; font-size: var(--fs-caption); color: var(--ink-soft); word-break: keep-all; line-height: 1.6; }
  .ref .url { padding: 8px 10px; border-radius: var(--radius); background: #f4f2ec; font-size: 14px; word-break: break-all; }
  .ref .btns { display: flex; gap: 8px; margin-top: 8px; }
  .ref .btns button { flex: 1; min-height: 44px; border: 1px solid var(--accent); border-radius: var(--radius); background: #fff; color: var(--accent-deep); font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
  .ref small { display: block; margin-top: 8px; font-size: var(--fs-caption); color: var(--ink-soft); }
  .promo { margin: 18px 0 4px; padding: 14px 16px; border: 1px solid var(--accent); border-radius: var(--radius-lg); background: var(--paper); }
  .promo b { display: block; font-size: 15.5px; }
  .promo p { margin: 2px 0 10px; font-size: var(--fs-caption); color: var(--ink-soft); word-break: keep-all; }
  .promo button { width: 100%; min-height: 48px; border: 0; border-radius: var(--radius); background: #FEE500; color: #191600; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer; }
  /* 탭 */
  .tabs { position: sticky; top: 73px; z-index: 20; display: grid; grid-template-columns: repeat(3, 1fr); margin: 16px -20px 0; padding: 0 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tabs button { min-height: 48px; border: 0; background: none; font: inherit; font-size: 15.5px; font-weight: 700; color: var(--ink-faint); border-bottom: 3px solid transparent; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--accent-deep); border-bottom-color: var(--accent); }
  .pane[hidden] { display: none; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 18px; }
  label.fl { display: block; font-size: var(--fs-sub); font-weight: 700; color: var(--ink); margin: 14px 0 6px; }
  label.fl:first-of-type { margin-top: 0; }
  label.fl .hint { font-weight: 400; color: var(--ink-faint); font-size: var(--fs-caption); }
  input, select, textarea { width: 100%; font-size: 17px; font-family: var(--font-body); padding: 13px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: #fcfbf8; color: var(--ink); }
  textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .btn { width: 100%; min-height: 54px; margin-top: 18px; padding: 15px; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font-size: 17px; font-weight: 800; font-family: var(--font-body); cursor: pointer; }
  .btn:disabled { opacity: .55; cursor: default; }
  .err { display: none; margin-top: 14px; padding: 13px 15px; background: var(--danger-soft, #f7e9e7); border: 1px solid var(--danger); border-radius: var(--radius); color: var(--danger); font-size: var(--fs-sub); line-height: 1.6; }
  .err.on { display: block; }
  .err a { color: var(--danger); font-weight: 700; }
  /* 주문 조회 결과(예전 order-lookup.html 그대로) */
  .res { margin-top: 18px; }
  .res-head { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: none; padding: 18px; }
  .res-oid { font-size: var(--fs-caption); color: var(--ink-faint); }
  .res-prod { font-family: var(--font-display); font-size: 21px; font-weight: 700; margin-top: 2px; word-break: keep-all; }
  .res-amt { font-size: var(--fs-price); font-weight: 800; color: var(--accent-deep); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tl { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 0; padding: 18px 12px 16px; background: var(--paper); border: 1px solid var(--line); border-top: 1px dashed var(--line); }
  .tl li { position: relative; text-align: center; font-size: var(--fs-caption); font-weight: 700; color: var(--ink-faint); padding-top: 16px; word-break: keep-all; }
  .tl li::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--line); }
  .tl li:first-child::before { border-radius: 2px 0 0 2px; }
  .tl li:last-child::before { border-radius: 0 2px 2px 0; }
  .tl li.done::before, .tl li.now::before { background: var(--accent); }
  .tl li::after { content: ""; position: absolute; top: -4px; left: calc(50% - 5px); width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
  .tl li.done::after { background: var(--accent); }
  .tl li.now::after { background: var(--paper); border: 3px solid var(--accent); }
  .tl li.now { color: var(--accent-deep); }
  .tl li small { display: block; font-weight: 400; color: var(--ink-faint); font-size: var(--fs-label); margin-top: 1px; }
  .tl.canceled li::before, .tl.canceled li::after { background: var(--line) !important; border-color: var(--line) !important; }
  .rows { background: var(--paper); border: 1px solid var(--line); border-top: none; border-radius: 0 0 var(--radius-lg) var(--radius-lg); padding: 4px 18px 16px; }
  .row { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: var(--fs-sub); }
  .row:first-child { border-top: none; }
  .row .k { color: var(--ink-faint); font-size: var(--fs-caption); padding-top: 2px; }
  .row .v { color: var(--ink); word-break: keep-all; }
  .banner { margin-top: 12px; padding: 14px 16px; border-radius: var(--radius); font-size: var(--fs-sub); line-height: 1.65; word-break: keep-all; }
  .banner.ok { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-deep); }
  .banner.warn { background: #fff7e5; border: 1px solid var(--gold); color: #6f4a08; }
  .banner.off { background: #f7f7f3; border: 1px solid var(--line); color: var(--ink-soft); }
  .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .acts a, .acts button { flex: 1 1 140px; min-height: 50px; display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: var(--fs-sub); font-weight: 700; font-family: var(--font-body); text-decoration: none; cursor: pointer; }
  .acts .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .foot-note { margin-top: 16px; font-size: var(--fs-caption); color: var(--ink-faint); line-height: 1.7; text-align: center; word-break: keep-all; }
  .foot-note a { color: var(--accent-deep); font-weight: 700; white-space: nowrap; }
  /* 회원 주문 목록 */
  .sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 0 8px; font-size: 14px; font-weight: 800; color: var(--ink-soft); }
  .sec-h small { font-weight: 400; color: var(--ink-faint); font-size: 12.5px; }
  .ord { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 10px; }
  .ord .t { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .ord .p { font-size: 16px; font-weight: 800; word-break: keep-all; }
  .ord .w { font-size: 13.5px; color: var(--ink-soft); margin-top: 2px; word-break: keep-all; }
  .ord .b { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
  .ord .amt { font-weight: 800; color: var(--accent-deep); font-variant-numeric: tabular-nums; }
  .ord img { width: 100%; border-radius: var(--radius); margin-top: 10px; display: none; }
  .ord .ph { font-size: 13px; color: var(--accent-deep); font-weight: 700; margin-top: 6px; }
  .badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .sbtn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: var(--radius); font: inherit; font-size: 14px; font-weight: 700; padding: 8px 14px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .sbtn.o { background: var(--paper); color: var(--accent-deep); }
  .sbtn.g { background: var(--paper); color: var(--ink-soft); border-color: var(--line); }
  details.more { margin-top: 18px; }
  details.more > summary { cursor: pointer; font-size: 14.5px; font-weight: 700; color: var(--ink-soft); padding: 10px 0; }
  .empty { padding: 22px 16px; text-align: center; color: var(--ink-faint); font-size: 14px; background: var(--paper); border: 1px dashed var(--line); border-radius: var(--radius-lg); word-break: keep-all; }
  /* 챙길 사람 */
  .pp { display: flex; gap: 12px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 8px; }
  .pp .av { width: 40px; height: 40px; border-radius: 50%; background: #f4ece0; color: #8a5a2b; display: flex; align-items: center; justify-content: center; font-weight: 800; flex: 0 0 auto; }
  .pp.mem .av { background: #eceae4; color: #5a564d; }
  .pp .tx { flex: 1; min-width: 0; }
  .pp .nm { font-weight: 800; font-size: 15.5px; word-break: keep-all; }
  .pp .dt { font-size: 13px; color: var(--ink-soft); word-break: keep-all; }
  .pp .dd { font-weight: 800; font-size: 14px; color: var(--ink-faint); white-space: nowrap; }
  .pp.soon { border-color: var(--accent); }
  .pp.soon .dd { color: #b04a2a; }
  .pp .ac { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pp .ac .sbtn { font-size: 13px; padding: 6px 11px; }
  .lu { font-size: 11px; font-weight: 700; color: #8a5a2b; background: #f7efe3; border-radius: 4px; padding: 0 4px; margin-right: 3px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .tools button { min-height: 50px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); font: inherit; font-size: 14.5px; font-weight: 700; color: var(--ink); cursor: pointer; padding: 8px; word-break: keep-all; }
  .tools button.main { grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: #fff; font-size: 16px; }
  .note { margin-top: 14px; padding: 12px 14px; border-radius: var(--radius); background: #f7f4ee; font-size: 13px; color: var(--ink-soft); line-height: 1.65; word-break: keep-all; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 7px 13px; font: inherit; font-size: 14.5px; cursor: pointer; color: var(--ink); }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .duo { display: grid; grid-template-columns: 1fr 1fr 1.1fr; gap: 6px; }
  .seg2 { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .seg2 button { flex: 1; border: 0; background: #fcfbf8; font: inherit; font-size: 15px; cursor: pointer; color: var(--ink-soft); }
  .seg2 button.on { background: var(--accent); color: #fff; font-weight: 700; }
  .addbox { margin-top: 12px; }
  .addbox .row2 { display: flex; gap: 8px; margin-top: 16px; }
  .addbox .row2 .btn { margin-top: 0; }
  .addbox .row2 .btn.g { flex: 0 0 96px; background: var(--paper); color: var(--ink-soft); border: 1px solid var(--line); }
  .pv { margin-top: 10px; font-size: 13.5px; color: var(--ink-soft); }
  .pv div { padding: 4px 0; border-bottom: 1px dashed var(--line-soft); }
  .pv .bad { color: var(--danger); }
  /* 내 안내장 */
  .cd { display: flex; gap: 10px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 8px; }
  .cd .k { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 4px; background: #2b2b2b; color: #fff; white-space: nowrap; }
  .cd .k.w { background: #f6dfe4; color: #8a2e44; }
  .cd .k.t { background: #e9efe9; color: #1f4733; }
  .cd .tx { flex: 1; min-width: 0; }
  .cd .nm { font-weight: 700; font-size: 15px; word-break: keep-all; }
  .cd .dt { font-size: 12.5px; color: var(--ink-faint); }
  .mk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .mk a { display: flex; align-items: center; justify-content: center; min-height: 50px; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); font-size: 14.5px; font-weight: 700; color: var(--ink); text-decoration: none; text-align: center; word-break: keep-all; padding: 6px; }
  .admin { margin-top: 14px; }
  @media (min-width: 1000px) {
    body { background: var(--bg-desk); }
    .wrap { background: var(--paper); box-shadow: 0 0 0 1px var(--line-soft); padding: 0 28px 40px; min-height: 100vh; }
    header { margin: 0 -28px; padding-left: 28px; padding-right: 28px; }
    .tabs { margin: 16px -28px 0; padding: 0 28px; background: var(--paper); }
    .card, .ord, .pp, .cd, .tools button, .mk a { background: #fcfbf8; }
  }
  @media (max-width: 380px) { .hdr-tel .ht-num { font-size: 17px; } .tools { grid-template-columns: 1fr; } }
</style>

<body>
<div class="wrap">
  <header>
    <div class="hdr-row">
      <a class="brand" href="/">꽃안부</a>
      <a class="hdr-tel" href="tel:1577-2286">
        <span class="ht-num">1577-2286</span>
        <span class="ht-sub">전화 주문 · 상담</span>
      </a>
    </div>
  </header>

  <div id="who"></div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tb-orders" aria-controls="p-orders" data-tab="orders">주문·배송</button>
    <button type="button" role="tab" id="tb-people" aria-controls="p-people" data-tab="people">챙길 사람</button>
    <button type="button" role="tab" id="tb-cards" aria-controls="p-cards" data-tab="cards">내 안내장</button>
  </div>

  <!-- 주문·배송 -->
  <section class="pane" id="p-orders" role="tabpanel" aria-labelledby="tb-orders">
    <div id="myOrders"></div>
    <div id="lookWrap">
      <h1 id="lookH">주문·배송 조회</h1>
      <p class="sub">주문번호와 연락처 뒷 4자리를 넣으면 지금 어디까지 왔는지 보여드려요. 회원가입은 필요 없습니다.</p>
      <div class="card" id="form">
        <label class="fl" for="oid">주문번호 <span class="hint">— 주문 후 받으신 문자에 있어요</span></label>
        <input id="oid" type="text" inputmode="latin" autocapitalize="characters" autocomplete="off" placeholder="예: AF20260916-3K7Q" enterkeyhint="next">
        <label class="fl" for="ph">연락처 뒷 4자리 <span class="hint">— 주문하신 분 휴대폰</span></label>
        <input id="ph" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000" enterkeyhint="search">
        <button class="btn" id="go">주문 찾기</button>
        <div class="err" id="err"></div>
      </div>
      <div class="res" id="res" hidden></div>
      <p class="foot-note">주문번호를 잃어버리셨어도 괜찮아요.<br><a href="tel:1577-2286">1577-2286</a> 으로 전화 주시면 찾아드립니다.</p>
    </div>
  </section>

  <!-- 챙길 사람 -->
  <section class="pane" id="p-people" role="tabpanel" aria-labelledby="tb-people" hidden>
    <div id="ppBody"></div>
  </section>

  <!-- 내 안내장 -->
  <section class="pane" id="p-cards" role="tabpanel" aria-labelledby="tb-cards" hidden>
    <div class="sec-h">내가 만든 부고장·청첩장 <small>이 기기에서 만든 것</small></div>
    <div id="cdList"></div>
    <div class="mk">
      <a href="/bugo/make">부고장 만들기</a>
      <a href="/wedding-card/make">청첩장 만들기</a>
      <a href="/bugo/make?ty=t">감사 인사장</a>
    </div>
    <p class="foot-note">고치는 열쇠는 만든 기기에만 있어요. 다른 폰에서 고치려면 만들 때 받은 '고칠 때 쓰는 링크'를 여세요.</p>
  </section>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });

  function parseYmd(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  // 음력은 서버(korean-lunar-calendar)에서 해마다 양력으로 바꿔 온다. 작년~10년 뒤.
  function fillLunar() {
    var need = PEOPLE.filter(function (a) { return a.cal_type === "lunar" && !LUNAR[a.month + "/" + a.day]; });
    if (!need.length) return Promise.resolve(PEOPLE);
    var keys = [], items = [];
    need.forEach(function (a) { var k = a.month + "/" + a.day; if (keys.indexOf(k) < 0) { keys.push(k); items.push({ m: a.month, d: a.day }); } });
    return fetch("/api/parse-url", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "lunar", items: items, y0: new Date().getFullYear() - 1, n: 12 }) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { if (j && j.dates) keys.forEach(function (k, i) { LUNAR[k] = j.dates[i] || []; }); return PEOPLE; })
      .catch(function () { return PEOPLE; });
  }
  // 다가오는 날(오늘 포함) 목록. 양력 2/29 는 윤년이 아니면 2/28 로.
  function nextDates(a, howMany) {
    var t0 = today0(), out = [];
    if (a.cal_type === "lunar") {
      (LUNAR[a.month + "/" + a.day] || []).forEach(function (s) { var d = parseYmd(s); if (d && d >= t0 && out.length < howMany) out.push(d); });
      return out;
    }
    for (var y = t0.getFullYear(); out.length < howMany && y < t0.getFullYear() + howMany + 1; y++) {
      var d = new Date(y, a.month - 1, a.day);
      if (d.getMonth() !== a.month - 1) d = new Date(y, a.month - 1, a.day - 1);
      if (d >= t0) out.push(d);
    }
    return out;
  }
  function dday(d) { return d ? Math.round((d - today0()) / 86400000) : null; }
  function lastOrderFor(a) {
    var who = (a.recipient || "").trim(); if (!who) return null;
    for (var i = 0; i < ORDERS.length; i++) if ((ORDERS[i].recipient_name || "").replace(/\s/g, "") === who.replace(/\s/g, "")) return ORDERS[i];
    return null;
  }
  // 환갑·칠순 같은 해(태어난 해와 올해 차이로 센다)
  var BIG = { 60: "환갑", 70: "칠순", 77: "희수", 80: "팔순", 88: "미수", 90: "구순", 100: "백수" };
  function milestone(a, d) {
    if (!a.birth_year || !d || isMem(a) || !/생/.test(a.label || "")) return "";
    var k = BIG[d.getFullYear() - a.birth_year];
    return k ? k + "(올해)" : "";
  }
  function drawPeople() {

        + '<div class="empty">로그인하면 쓸 수 있어요.<br><button type="button" class="sbtn" style="margin-top:12px" id="ppLogin">로그인 · 가입</button></div>';

  function saveRows(rows) {

  // 여러 명 붙여넣기 — '어머니 음력 9/15', '장인어른 12월 3일', '박서연 결혼기념일 11.14'
  function parseLine(s) {
    s = String(s || "").trim(); if (!s) return null;
    var lunar = /음력/.test(s);
    // 1956.03.07 · 1956-3-7 처럼 태어난 해까지 붙은 날짜
    var full = /(19\d\d|20\d\d)\s*[.\/\-년]\s*(\d{1,2})\s*[.\/\-월]\s*(\d{1,2})\s*일?/.exec(s);
    if (full) s = s.replace(full[0], " " + full[2] + "/" + full[3] + " " + full[1] + "년생 ");
    var m = /(\d{1,2})\s*(?:월|[\/.\-])\s*(\d{1,2})\s*일?/.exec(s);
    if (!m) return { bad: s };
    var mo = +m[1], d = +m[2];
    if (!(mo >= 1 && mo <= 12 && d >= 1 && d <= 31)) return { bad: s };
    var rest = (s.slice(0, m.index) + " " + s.slice(m.index + m[0].length)).replace(/음력|양력|[,\t|]/g, " ").replace(/\s+/g, " ").trim();
    var y = /(19\d\d|20\d\d)\s*년?생?/.exec(rest); if (y) rest = rest.replace(y[0], " ").replace(/\s+/g, " ").trim();
    var kind = "생일";
    var km = /(생신|생일|결혼기념일|결혼 기념일|기일|제사|추도일|개업일|창립일|기념일)/.exec(rest);
    if (km) { kind = km[1].replace(/\s/g, "") === "생신" ? "생일" : km[1].replace(/\s/g, ""); rest = rest.replace(km[0], " ").replace(/\s+/g, " ").trim(); }
    if (!rest) return { bad: s };
    return { recipient: rest.slice(0, 20), label: kind, month: mo, day: d, cal_type: lunar ? "lunar" : "solar", birth_year: y ? +y[1] : null };
  }

  // '생일 알려줘' 링크 — 받은 사람이 /ask 에서 생일을 적으면 내 수첩에 바로 들어온다(서버가 회원 id 를 서명해 둔다)
  function makeAsk() {
    var b = $("ppAsk"); b.disabled = true;
    SB().auth.getSession().then(function (s) {
      var at = s && s.data && s.data.session && s.data.session.access_token;
      return fetch("/api/parse-url", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "askmake", at: at || "" }) });
    }).then(function (r) { return r.json(); }).then(function (j) {

      var nm = (A().name ? A().name(USER) : "").slice(0, 12);
      var url = location.origin + "/ask?u=" + j.u + "&t=" + j.t + "&n=" + encodeURIComponent(nm);

      if (navigator.share) { navigator.share({ title: "생일 알려 주기", text: text, url: url }).catch(function () {}); return; }
      copyText(url).then(function () { alert("링크를 복사했어요. 카톡에 붙여 보내 주세요.\n\n" + url); });

  function copyText(s) {

  // 내 달력에 넣기(.ics) — 양력은 해마다 반복 한 줄, 음력은 날짜가 해마다 달라 10년치를 따로. 7일 전·하루 전 아침 9시 알림.
  function icsEsc(v) { return String(v || "").replace(/([,;\\])/g, "\\$1").replace(/\n/g, "\\n"); }
  function icsDay(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0"); }
  function downloadIcs() {
    if (!PEOPLE.length) { alert("먼저 사람을 추가해 주세요."); return; }
    var stamp = icsDay(new Date()) + "T000000Z", url = location.origin + "/my?tab=people", L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//kkotanbu//people//KO", "X-WR-CALNAME:꽃안부 챙길 사람"];
    function ev(a, d, uid, rr) {
      var nx = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1), t = title(a);
      L.push("BEGIN:VEVENT", "UID:" + uid + "@kkotanbu", "DTSTAMP:" + stamp, "DTSTART;VALUE=DATE:" + icsDay(d), "DTEND;VALUE=DATE:" + icsDay(nx));
      if (rr) L.push("RRULE:FREQ=YEARLY");
      L.push("SUMMARY:" + icsEsc((a.cal_type === "lunar" ? "(음력 " + a.month + "/" + a.day + ") " : "") + t),
        "DESCRIPTION:" + icsEsc(isMem(a) ? "꽃안부 챙길 사람" : "꽃 보내기: " + url), "URL:" + url,
        "BEGIN:VALARM", "TRIGGER:-P6DT15H", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(t + " 7일 전"), "END:VALARM",
        "BEGIN:VALARM", "TRIGGER:-PT15H", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(t + " 내일"), "END:VALARM", "END:VEVENT");
    }
    PEOPLE.forEach(function (a) {
      if (a.cal_type === "lunar") nextDates(a, 10).forEach(function (d) { ev(a, d, a.id + "-" + d.getFullYear(), false); });
      else { var d = nextDates(a, 1)[0]; if (d) ev(a, d, a.id, true); }
    });
    L.push("END:VCALENDAR");
    var u = URL.createObjectURL(new Blob([L.join("\r\n")], { type: "text/calendar;charset=utf-8" }));
    var l = document.createElement("a"); l.href = u; l.download = "꽃안부-챙길사람.ics"; document.body.appendChild(l); l.click(); l.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
  }

  // ── 내 안내장(이 기기 localStorage af_cards — card-make.html 이 넣는다) ──
  function drawCards() {
    var a = [];
    try { a = JSON.parse(localStorage.getItem("af_cards") || "[]"); if (!Array.isArray(a)) a = []; } catch (_e) { a = []; }
    var now = Date.now();
    a = a.filter(function (x) { return x && x.id && (!x.exp || Date.parse(x.exp) > now); });
    if (!a.length) { $("cdList").innerHTML = '<div class="empty">이 기기에서 만든 부고장·청첩장이 없어요.</div>'; return; }
    $("cdList").innerHTML = a.map(function (x) {
      var t = x.ty === "t" ? ["감사", "t"] : x.k === "w" ? ["청첩장", "w"] : ["부고", ""];
      var at = new Date(x.at), ex = new Date(x.exp);
      var path = x.k === "w" ? "/wedding-card/make" : "/bugo/make";
      return '<div class="cd"><span class="k ' + t[1] + '">' + t[0] + '</span><div class="tx"><div class="nm">' + esc(x.t || "안내") + '</div>'
        + '<div class="dt">' + (isFinite(at) ? (at.getMonth() + 1) + "/" + at.getDate() + " 만듦" : "") + (isFinite(ex) ? " · " + (ex.getMonth() + 1) + "/" + ex.getDate() + " 자동 삭제" : "") + "</div></div>"
        + '<a class="sbtn o" href="/c/' + encodeURIComponent(x.id) + '">보기</a><a class="sbtn g" href="' + path + "?edit=" + encodeURIComponent(x.id) + '">고치기</a></div>';
    }).join("");
  }

  // ── 시작 ──
  var q = new URLSearchParams(location.search);
  if (q.get("o")) { $("oid").value = q.get("o").toUpperCase(); }
  setTab(q.get("tab"));
  var started = false;
  function onUser(u) {
    var same = started && ((u && USER && u.id === USER.id) || (!u && !USER));
    USER = u || null; started = true;
    drawWho();
    if (same) return;
    drawOrders();
    if (USER) { $("ppBody").innerHTML = '<div class="empty" style="margin-top:16px">불러오는 중…</div>'; refreshPeople(); } else { PEOPLE = []; drawPeople(); }
    if (!USER && q.get("o")) $("ph").focus();
  }
  document.addEventListener("af-auth-change", function (e) { onUser(e.detail && e.detail.user); });
  // auth.js 가 없거나(설정 없음) 늦으면 비회원 화면으로
  setTimeout(function () { if (!started) onUser(null); }, 2500);
})();
</script>
</body>
</html>
