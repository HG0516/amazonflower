<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>주문 관리 — 꽃안부 관리자</title>
<link rel="stylesheet" href="/tokens.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif);background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px;padding:0 0 40px;}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px;}
  header{text-align:center;padding:18px 0 4px;}
  h1{font-size:20px;font-weight:800;}
  .sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  input[type=password]{width:100%;font-size:16px;padding:12px 13px;border:1px solid var(--line);border-radius:8px;background:#fcfbf8;color:var(--ink);font-family:inherit;}
  input:focus{outline:none;border-color:var(--accent);}
  .pwbar{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:6px;}
  .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px;}
  .sumcard{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;font-family:inherit;color:var(--ink);cursor:pointer;}
  .sumcard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
  .qhit{margin-top:12px;font-size:13.5px;font-weight:700;color:var(--ink-soft);}
  .sumcard .s2{font-size:10.5px;color:var(--ink-faint);margin-top:1px;word-break:keep-all;}
  .sumcard .n{font-size:20px;font-weight:800;font-family:var(--font-display,inherit);}
  .sumcard .l{font-size:12.5px;font-weight:700;color:var(--ink);margin-top:2px;}
  .sumcard.urgent .n{color:#c0503f;}
  .bar{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px;-webkit-overflow-scrolling:touch;align-items:center;}
  .pill{white-space:nowrap;padding:7px 13px;border:1px solid var(--line);border-radius:20px;background:var(--paper);font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;}
  .pill.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .refresh{margin-left:auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;font-size:13px;font-weight:700;padding:7px 12px;cursor:pointer;color:var(--ink-soft);font-family:inherit;white-space:nowrap;}

  .order{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;}
  .order.urgent{border-color:#c0503f;box-shadow:0 0 0 1px #c0503f;}
  .o-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .o-name{font-size:17px;font-weight:800;}
  .o-name .to{font-size:12px;color:var(--ink-faint);font-weight:600;}
  .badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap;}
  .b-new{background:#f0eee8;color:#7a766c;}
  .b-ordered{background:#e8f0ea;color:#1f4733;}
  .b-delivered{background:#eaf0f6;color:#355d8a;}
  .b-canceled{background:#fbecea;color:#9a3b2e;}
  .b-refund{background:#fff0d8;color:#8a5312;}
  .b-bank{background:#fff7e0;color:#7a5a12;margin-right:5px;}
  .b-va{background:#eaf0f6;color:#355d8a;margin-right:5px;}
  .b-awaiting_deposit{background:#fff0d8;color:#8a5312;}
  .b-gift_wait{background:#fbeef1;color:#8a2e44;}
  .b-expired{background:#f0eee8;color:#7a766c;}
  .o-wait{flex:1 1 100%;padding:10px 12px;border-radius:8px;background:#fff7e5;color:#6f4a08;font-size:13px;font-weight:700;line-height:1.5;}
  .order.awaiting{border-color:#d29b31;}
  .order.expired{opacity:.62;}
  .order.canceled{opacity:.62;}
  .order.refund-pending{border-color:#d49a45;background:#fffbf3;box-shadow:0 0 0 1px #f0d8b2;}
  .b-urgent{background:#fbecea;color:#9a3b2e;margin-left:5px;}
  .o-prod{font-size:15px;font-weight:700;margin-top:8px;}
  .o-amt{color:var(--accent-deep,#1f4733);font-weight:800;}
  .o-rows{margin-top:8px;font-size:13px;color:var(--ink-soft);line-height:1.7;}
  .o-rows b{color:var(--ink);font-weight:700;}
  .o-rows .lbl{display:inline-block;min-width:52px;color:var(--ink-faint);}
  .o-ribbon{background:#faf8f2;border:1px solid var(--line-soft,#eeece4);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px;}
  .o-actions{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
  .o-actions button,.o-actions a{flex:1;min-width:92px;text-align:center;text-decoration:none;padding:10px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);}
  .o-actions .on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .o-actions .photo{background:#1f1d18;color:#fff;border-color:#1f1d18;}
  .o-meta{font-size:11px;color:var(--ink-faint);margin-top:9px;}
  .o-photo{margin-top:8px;}
  .o-photo img{max-width:120px;border-radius:8px;}
  .o-lock{flex:1;text-align:center;padding:11px;border-radius:8px;background:#fff0d8;color:#75450d;font-size:13px;font-weight:800;}
  .empty{text-align:center;color:var(--ink-faint);padding:40px 10px;font-size:14px;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;}
  .toast.show{opacity:1;} .toast.err{background:#9a3b2e;}
  .navlink{display:inline-block;margin-top:16px;font-size:13px;color:var(--accent);text-decoration:none;}
  /* 관리자 새 틀 */
  @media (min-width:1000px){ header{text-align:left;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>주문 관리</h1>
    <div class="sub">해야 할 주문이 위로 와요. 급한 것부터 처리하면 돼요.</div>
  </header>


  <div class="summary" id="summary" style="display:none;"></div>
  <div class="bar" id="bar" style="display:none;"></div>
  <div id="list"></div>
  <a class="navlink" href="/admin-products.html">← 상품 관리</a>
  <a class="navlink" data-owner-only href="/admin-setup.html" style="float:right;">⚙️ 설정 점검</a>
</div>

<div class="toast" id="toast"></div>

<script src="/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin-auth.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => (Number(n)||0).toLocaleString()+"원";
// 상태 이름은 쉬운 말로(11/2 관리자 새 틀): 접수됨 → 새 주문, 준비중 → 만드는 중. 서버 값(new·ordered…)은 그대로.
const STLABEL = { new:"새 주문", ordered:"만드는 중", delivered:"배송완료", canceled:"환불됨", awaiting_deposit:"입금 대기", expired:"기한 지남", gift_wait:"주소 대기" };
// 무통장(손님이 주문서에서 고름 · 사장님이 전화로 등록) / 가상계좌
const isBankOrder = (o) => o && (o.payment_method==="MANUAL_BANK" || o.payment_method==="BANK_TRANSFER" || /^AFB/.test(o.order_id||""));
const isVaOrder = (o) => o && o.payment_method==="가상계좌";
// 돈이 아직 안 들어온 주문 — 만들면 안 된다
const notPaidYet = (o) => o && (o.status==="awaiting_deposit" || o.status==="expired");
let ORDERS = [];
let curFilter = "todo";
let curQ = (window.afAdmin && afAdmin.query) || "";
// 해야 할 것 = 돈이 들어왔고 아직 배송 전, 환불 중 아님. 선물 주소 대기는 '기다리는 중'으로 뺀다.
const isTodo = (o) => !isRefundPending(o) && !["delivered","canceled","gift_wait"].includes(o.status) && !notPaidYet(o);
const isWaiting = (o) => !isRefundPending(o) && (o.status==="awaiting_deposit" || o.status==="gift_wait");
const isNew = (o) => !isRefundPending(o) && (o.status||"new")==="new";
// 위 검색창: 주문번호·이름·전화번호(숫자만 비교)
function matchQ(o, q){
  if(!q) return true;
  const t = q.toLowerCase(), d = q.replace(/\D/g,"");
  const txt = [o.order_id,o.recipient_name,o.sender_name,o.orderer_name,o.ribbon_sender,o.depositor_name,o.corp_name,o.product_label].filter(Boolean).join(" ").toLowerCase();
  if(txt.includes(t)) return true;
  if(d.length>=3){ const ph=[o.recipient_phone,o.sender_phone,o.orderer_phone].filter(Boolean).map(x=>String(x).replace(/\D/g,"")).join(" "); if(ph.includes(d)) return true; }
  return false;
}
document.addEventListener("af-admin-search", e=>{ curQ = e.detail||""; if(ORDERS.length) render(); });

function nowMs(){ return new Date().getTime(); }
function isRefundPending(o){ return !!(o && o.cancel_requested_at && o.status!=="canceled"); }
function isUrgent(o){
  if(isRefundPending(o) || o.status==="delivered" || o.status==="canceled" || notPaidYet(o)) return false;
  if(!o.event_at) return false;
  const t = new Date(o.event_at).getTime();
  if(isNaN(t)) return false;
  return t <= nowMs() + 6*3600000;   // 6시간 내(또는 이미 지남)
}
// 도착 시각: event_time 에 '11:00'·'당일중' 같은 실제 글이 있다. delivery_time_slot 은 버튼 이름(custom·today…)이라
// 그대로 보이면 'custom' 이 찍혔다(10/29 엄마 화면). 글이 없을 때만 버튼 이름을 말로 바꿔 쓴다.
const SLOT_LABEL = { am:"오전중", pm:"오후중", today:"당일중", call:"통화 후 결정" };
function fmtDateTime(o){
  const d = o.delivery_date || o.event_date || "";
  const t = o.event_time || SLOT_LABEL[o.delivery_time_slot] || "";
  return [d, t].filter(Boolean).join(" ");
}

// ── 발주 복사(10/29 엄마): 협력 꽃집에 카톡으로 넘길 글. 결제 금액·주문자 번호·주문번호는 넣지 않는다 ──
// 엄마가 손으로 보내던 순서: 상품 → 날짜·시간 → 받는 분 → 장소 → 주소 → 리본(문구·보내는 분) → 요청.
// AF_ORDER_TEXT_START
// 메모 칸(request_note·note)에 붙은 표시를 나눈다: [상품 N가지: …] [발인·예식·행사 …] [상주 …] [원문 링크] [카드] 나머지=손님 요청.
function noteParts(o){
  let n = String(o.request_note || o.note || "");
  const out = { multi:"", ev:"", mourner:"", src:"", card:false, rest:"" };
  n = n.replace(/\[상품 \d+가지: ([^\]]*)\]/, (_, x) => { out.multi = x; return ""; });
  n = n.replace(/\[(발인|예식|행사) ([^\]]*)\]/, (_, k, t) => { out.ev = k + " " + t; return ""; });
  n = n.replace(/\[상주 ([^\]]*)\]/, (_, x) => { out.mourner = x; return ""; });
  n = n.replace(/\[원문 (https?:\/\/[^\]\s]+)\]/, (_, x) => { out.src = x; return ""; });
  n = n.replace(/\[카드\]\s*/, () => { out.card = true; return ""; });
  out.rest = n.replace(/\s+/g, " ").trim();
  return out;
}
// 협력 꽃집에서 쓰는 상품 이름(아버지 대응표, 10/29 형구 '바꾸기'). 비어 있으면 우리 상품 이름 그대로 나간다.
// 예) "WC-01": "근조 기본"  — 상품 코드는 /prices 에 있다.
const PARTNER_NAME = {};
function afOrderText(o){
  const L = [], np = noteParts(o);
  L.push(np.multi ? np.multi : (PARTNER_NAME[o.product_code] || o.product_label || o.product_code || "꽃 주문"));
  const d = o.delivery_date || o.event_date || "";
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const day = m ? `${+m[2]}월 ${+m[3]}일(${"일월화수목금토"[new Date(`${d}T12:00:00+09:00`).getUTCDay()]})` : d;
  const t = o.event_time || SLOT_LABEL[o.delivery_time_slot] || "";
  const when = [day, /^\d{1,2}:\d{2}$/.test(t) ? t + "까지" : t].filter(Boolean).join(" ");
  if (when || np.ev) L.push([when, np.ev].filter(Boolean).join(" · "));
  if (o.recipient_name) L.push((o.order_type === "funeral" ? "고인ㆍ" : "받는 분ㆍ") + o.recipient_name);
  if (np.mourner) L.push("상주ㆍ" + np.mourner);
  const road = [o.road_address, o.detail_address].filter(Boolean).join(" ");
  const place = road ? [o.building_name, o.room_info].filter(Boolean).join(" ") : (o.venue || "");
  const addr = road || o.address || "";
  if (place) L.push("장소ㆍ" + place);
  if (addr && addr !== place) L.push("주소ㆍ" + String(addr).replace(/^\[\d{5}\]\s*/, ""));
  if (o.recipient_phone) L.push("받는 분 연락처ㆍ" + o.recipient_phone);
  let who = o.ribbon_sender || "", words = o.ribbon_text || "";
  if (!who && !words && o.ribbon) {
    const parts = String(o.ribbon).split(" / ");
    if (parts.length >= 2) { who = parts[0]; words = parts.slice(1).join(" / "); } else words = parts[0];
  }
  if (words) L.push("리본ㆍ" + words);
  if (who) L.push("보내는 분ㆍ" + who);
  if (!who && !words && (o.sender_name || o.orderer_name)) L.push("보내는 분ㆍ" + (o.sender_name || o.orderer_name));
  if (np.rest) L.push((np.card ? "카드 문구ㆍ" : "요청ㆍ") + np.rest);
  if (np.src) L.push((o.order_type === "funeral" ? "부고장ㆍ" : o.order_type === "wedding" ? "청첩장ㆍ" : "원문ㆍ") + np.src);
  return L.join("\n");
}
// AF_ORDER_TEXT_END
async function copyOrderText(i, btn){
  const o = (window.__shown || [])[i]; if(!o) return;
  const txt = afOrderText(o), old = btn.textContent;
  try{ await navigator.clipboard.writeText(txt); toast("발주 내용 복사됨 — 금액·주문자 번호는 빠져 있어요 ✓"); btn.textContent="✓ 복사됨"; }
  catch(e){ prompt("이 글을 복사해 꽃집에 보내세요:", txt); }
  setTimeout(()=>{ btn.textContent=old; }, 1800);
}
// ── 화원에 보내기(11/5 꽃집 페이지 2단계): '발주 복사' 글을 화원 사장님 화면(/my-shop)으로 보낸다. 사장님(owner)만.
// 가게 표가 아직 없으면(SQL 적용 전) 버튼이 안 보이고 지금 화면 그대로다. 서버 = lib/dispatch.mjs.
let HW = [], DISP = {};
const DST = { offered:"답 기다리는 중", accepted:"만드는 중", done:"배송 완료", declined:"못 한다고 함", canceled:"거둠" };
async function shopsApi(payload){
  const r = await afAdmin.fetch("/api/admin", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({resource:"shops", ...payload}) });
  const d = await r.json().catch(()=>({}));
  return r.ok ? d : { error: d.error || "오류", notReady: d.notReady };
}
async function loadDispatch(){
  if(afAdmin.role!=="owner") return;
  const [sh, dp] = await Promise.all([shopsApi({ action:"list" }), shopsApi({ action:"dispatch-of", orderIds: ORDERS.map(o=>o.order_id).filter(Boolean).slice(0,200) })]);
  if(sh.error || !sh.shops) return;
  HW = sh.shops.filter(x=>x.kind==="hwawon" && x.status==="active");
  DISP = {};
  (dp.dispatches||[]).forEach(d=>{ if(!DISP[d.order_id]) DISP[d.order_id]=d; });   // 최근 것 하나
  render();
}
function dispLine(o){
  const d = DISP[o.order_id]; if(!d) return "";
  const live = d.status==="offered" || d.status==="accepted";
  return `<div class="o-wait" style="margin-top:10px;background:#eef4ef;color:#1f4733;">🏵 ${esc(d.shop_name||"화원")} · ${DST[d.status]||d.status} · 제작비 ${Number(d.fee||0).toLocaleString()}원${live?` <button style="margin-left:6px;padding:3px 10px;border-radius:999px;border:1px solid #c9d8cc;background:#fff;font:inherit;font-size:12px;cursor:pointer" onclick="recallDispatch('${esc(d.id)}',this)">거두기</button>`:""}</div>`;
}
function hwBtn(o,i){
  if(afAdmin.role!=="owner" || !HW.length || (o.status||"new")!=="new") return "";
  const d = DISP[o.order_id]; if(d && (d.status==="offered"||d.status==="accepted")) return "";
  return `<button onclick="sendHwawon(${i})">🏵 화원에 보내기</button>`;
}
function ribbonOf(o){
  let who = o.ribbon_sender || "", words = o.ribbon_text || "";
  if (!who && !words && o.ribbon) { const parts = String(o.ribbon).split(" / "); if (parts.length >= 2) { who = parts[0]; words = parts.slice(1).join(" / "); } else words = parts[0]; }
  return { who: who || o.sender_name || o.orderer_name || "", words };
}
function sendHwawon(i){
  const o = (window.__shown||[])[i]; if(!o) return;
  const rb = ribbonOf(o), text = afOrderText(o);
  const ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px";
  ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:440px;width:100%;max-height:90vh;overflow:auto;padding:18px">
    <b style="font-size:17px">화원에 보내기</b>
    <pre style="white-space:pre-wrap;font:inherit;font-size:13.5px;background:#f6f4ef;border-radius:8px;padding:10px;margin:10px 0">${esc(text)}</pre>
    <label style="display:block;font-size:13px;font-weight:700;margin-top:8px">화원</label>
    <select id="hwSel" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;font:inherit">${HW.map(h=>`<option value="${esc(h.id)}">${esc(h.name)}${(h.wreath_area||[]).length?" · "+esc(h.wreath_area.join(", ")):""}</option>`).join("")}</select>
    <label style="display:block;font-size:13px;font-weight:700;margin-top:8px">제작비(원)</label>
    <input id="hwFee" inputmode="numeric" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;font:inherit" placeholder="예: 55000">
    <label style="display:block;font-size:13px;font-weight:700;margin-top:8px">답 마감(비워 두면 없음)</label>
    <input id="hwDl" type="datetime-local" style="width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;font:inherit">
    <div style="font-size:12px;color:#7a766c;margin-top:8px">결제 금액·주문자 번호는 화원에게 안 가요. 화원이 받으면 이 주문이 '만드는 중'으로 바뀌고 텔레그램으로 알려요.</div>
    <div style="display:flex;gap:8px;margin-top:14px"><button id="hwX" style="flex:1;padding:11px;border:1px solid #ddd;border-radius:8px;background:#fff;font:inherit;font-weight:700;cursor:pointer">닫기</button><button id="hwGo" style="flex:1;padding:11px;border:0;border-radius:8px;background:#2f5d46;color:#fff;font:inherit;font-weight:700;cursor:pointer">보내기</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector("#hwX").onclick = () => ov.remove();
  ov.querySelector("#hwGo").onclick = async (e) => {
    const fee = parseInt(String(ov.querySelector("#hwFee").value).replace(/[^0-9]/g,""), 10);
    if(!(fee >= 0)) return toast("❌ 제작비를 넣어 주세요","err");
    const dl = ov.querySelector("#hwDl").value;
    e.target.disabled = true;
    const d = await shopsApi({ action:"dispatch", orderId:o.order_id, shopId:ov.querySelector("#hwSel").value, fee,
      deadline: dl ? new Date(dl).toISOString() : null,
      snapshot:{ text, product:o.product_label||o.product_code||"", date:o.delivery_date||o.event_date||"", time:o.event_time||"", ribbon:rb.words, sender:rb.who, place:o.building_name||o.venue||"" } });
    if(d.error){ e.target.disabled = false; return toast("❌ "+d.error,"err"); }
    ov.remove(); toast("화원에 보냈어요 ✓"); DISP[o.order_id] = d.dispatch; render();
  };
}
async function recallDispatch(id, btn){
  if(!confirm("이 발주를 거둘까요? 화원 화면에서 사라져요. 화원이 이미 만들고 있으면 전화로 먼저 알려 주세요.")) return;
  btn.disabled = true;
  const d = await shopsApi({ action:"dispatch-cancel", id });
  if(d.error){ btn.disabled = false; return toast("❌ "+d.error,"err"); }
  toast("거뒀어요"); loadDispatch();
}
function fmtAddr(o){
  const road = [o.road_address, o.detail_address].filter(Boolean).join(" ");
  const bld = [o.building_name, o.room_info].filter(Boolean).join(" ");
  if(road) return [road, bld].filter(Boolean).join(" · ");
  return [o.venue, o.address].filter(Boolean).join(" ");
}

async function api(payload){
  const r = await afAdmin.fetch("/api/admin", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({resource:"order", ...payload}) });
  const data = await r.json().catch(()=>({}));
  if(!r.ok){ toast("❌ "+(data.error||"오류"),"err"); return null; }
  return data;
}

async function load(){
  const data = await api({ action:"list" });
  if(!data) return;
  ORDERS = data.orders || [];
  render();
  loadDispatch();
}

function render(){
  const urg = ORDERS.filter(isUrgent).length;
  const newN = ORDERS.filter(isNew).length;
  const makeN = ORDERS.filter(o=>!isRefundPending(o) && o.status==="ordered").length;
  const waitN = ORDERS.filter(isWaiting).length;
  const refundN = ORDERS.filter(isRefundPending).length;
  try{ afAdmin.setNewCount(newN); }catch(_){}
  $("summary").style.display = "grid";
  const C = [["urgent",urg,"급해요","시간 다가옴","urgent"],["new",newN,"새 주문","아직 발주 전",""],["ordered",makeN,"만드는 중","사진 올리면 끝",""],["wait",waitN,"기다리는 중","입금·주소",""]];
  $("summary").innerHTML = C.map(([k,n,l,s2,cls])=>`<button type="button" class="sumcard ${cls} ${curFilter===k?"on":""}" onclick="setFilter('${k}')"><div class="n">${n}</div><div class="l">${l}</div><div class="s2">${s2}</div></button>`).join("");

  const F = [["todo","해야 할 것"],["all","전체"],["delivered","배송완료"],["refund",`환불${refundN?` ${refundN}`:""}`],["corp","법인"],["stats","숫자 보기"]];
  $("bar").innerHTML = F.map(([k,l])=>`<button class="pill ${curFilter===k?"on":""}" onclick="setFilter('${k}')">${l}</button>`).join("")

  if(curFilter==="stats"){ $("list").innerHTML = statsHtml(); return; }
  if(curFilter==="corp"){ $("list").innerHTML = corpHtml(); return; }

  let list = ORDERS.slice();
  if(curQ){
    // 검색은 칸과 상관없이 전체에서 찾는다
    list = list.filter(o=>matchQ(o,curQ));

  else if(curFilter==="urgent") list = list.filter(isUrgent);
  else if(curFilter==="refund") list = list.filter(isRefundPending);

  window.__shown = list;
  $("list").innerHTML = (curQ?`<div class="qhit">"${esc(curQ)}"(으)로 찾은 주문 ${list.length}건</div>`:"") + list.map((o,_i)=>{
    const st = o.status || "new";
    const refundPending = isRefundPending(o);
    const urgent = isUrgent(o);
    const dt = fmtDateTime(o), addr = fmtAddr(o);
    const sender = o.ribbon_sender || o.sender_name || o.orderer_name || "";
    const phone = o.recipient_phone || "";
    const sPhone = o.sender_phone || o.orderer_phone || "";
    const ribbon = o.ribbon_text || o.ribbon || "";
    const np = noteParts(o);
    const req = [np.multi?`[상품: ${np.multi}]`:"", np.ev?`[${np.ev}]`:"", np.card&&np.rest?`[카드] ${np.rest}`:np.rest].filter(Boolean).join(" ");
    const oid = esc(o.order_id||"");
    const photoNotice = o.photo_notice_status === "sent" ? "고객 문자 전송됨"
      : o.photo_notice_status === "failed" ? "고객 문자 실패"
      : o.photo_notice_status === "skipped" ? (o.photo_notify_error === "manual_mode" ? "링크 직접 전달 필요" : "주문자 번호 없음")
      : o.photo_notice_status === "pending" ? "고객 문자 전송 중" : "";
    return `<div class="order ${urgent?'urgent':''} ${st==='awaiting_deposit'?'awaiting':''} ${st==='expired'?'expired':''} ${st==='canceled'?'canceled':''} ${refundPending?'refund-pending':''}">

      </div>
      <div class="o-prod">${esc(o.product_label||o.product_code||"주문")} · <span class="o-amt">${won(o.amount)}</span></div>
      <div class="o-rows">
        ${dt?`<div><span class="lbl">행사</span><b>${esc(dt)}</b></div>`:''}
        ${addr?`<div><span class="lbl">배송지</span>${esc(addr)}</div>`:''}
        ${phone?`<div><span class="lbl">받는분</span><a href="tel:${esc(phone)}">${esc(phone)}</a></div>`:''}
        ${sender?`<div><span class="lbl">보내는분</span>${esc(sender)}${sPhone?` · <a href="tel:${esc(sPhone)}">${esc(sPhone)}</a>`:''}</div>`:''}
        ${np.mourner?`<div><span class="lbl">상주</span>${esc(np.mourner)}</div>`:''}
        ${req?`<div><span class="lbl">요청</span>${esc(req)}</div>`:''}
        ${np.src?`<div><span class="lbl">${o.order_type==="funeral"?"부고장":o.order_type==="wedding"?"청첩장":"원문"}</span><a href="${esc(np.src)}" target="_blank" rel="noopener">링크 열기</a></div>`:''}
      </div>
      ${ribbon?`<div class="o-ribbon">🎀 <b>리본</b> · ${esc(ribbon)}</div>`:''}
      ${o.completed_photo&&!refundPending?`<div class="o-photo"><button onclick="viewPhoto('${oid}',this)" style="font-size:12px;color:#1f4733;font-weight:700;background:#e8f0ea;border:1px solid #1f4733;border-radius:7px;padding:6px 11px;cursor:pointer;font-family:inherit;">📷 올린 사진 보기</button>${photoNotice?` <span style="font-size:12px;color:${o.photo_notice_status==='sent'?'#1f4733':'#9a3b2e'};font-weight:700;">${esc(photoNotice)}</span>`:''}${o.photo_notice_status!=='sent'?` <button onclick="resendPhoto('${oid}',this)" style="font-size:12px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:#fff;cursor:pointer;">문자 다시 보내기</button>`:''}</div>`:''}
      ${st==='awaiting_deposit'
        ? (isVaOrder(o)
          ? `<div class="o-actions"><div class="o-wait">🏦 가상계좌 입금 대기 — 아직 만들지 마세요. 입금되면 '입금 확인' 알림과 함께 자동으로 접수돼요.</div></div>`
          : `<div class="o-actions"><div class="o-wait">💰 무통장 입금 대기 — 아직 만들지 마세요. 통장에 들어온 걸 확인하면 '입금 확인'을 눌러주세요.</div>${afAdmin.role==="owner"?`<button class="on" onclick="depositOrder('${oid}',this)">💰 입금 확인</button><button onclick="voidOrder('${oid}',this)">🗑 주문 취소(입금 전)</button>`:''}</div>`)
        : st==='gift_wait' ? `<div class="o-actions"><div class="o-wait" style="background:#fbeef1;color:#8a2e44;">선물이라 받는 분이 주소를 넣기 전이에요. 아직 만들지 마세요. 주소가 들어오면 평소처럼 주문 알림이 다시 와요. 7일 안에 안 넣으면 자동으로 환불돼요.</div>${afAdmin.role==="owner"?`<button style="color:#9a3b2e;border-color:#e5c4bf;" onclick="cancelOrder('${oid}',this)">💸 결제취소</button>`:''}</div>`
        : st==='expired' ? `<div class="o-actions"><div class="o-wait" style="background:#f0eee8;color:#7a766c;">⌛ 입금 기한이 지나 닫힌 주문이에요. 만들지 않습니다.</div></div>`
        : st==='canceled'?`<div class="o-actions"><div style="flex:1;text-align:center;padding:10px;font-size:13px;color:#9a3b2e;font-weight:700;">💸 환불 완료된 주문이에요${o.canceled_at?` (${String(o.canceled_at).slice(5,16).replace("T"," ")})`:''}</div></div>`:refundPending?`<div class="o-actions"><div class="o-lock">🔒 환불 결과 확인 전까지 발주·배송·사진 작업을 잠갔어요.</div><button onclick="load()">↻ 환불 상태 확인</button></div>`:`<div class="o-actions">
        <button onclick="copyOrderText(${_i},this)">📋 발주 복사</button>

function setFilter(k){ curFilter=k; render(); }

// ── 법인 거래처 ──
// 사업자번호 기준으로 묶는다(상호는 '(주)' 유무 등 표기가 흔들려 같은 회사가 갈린다).
function corpHtml(){
  const os=ORDERS.filter(o=>o.corp_name && o.status!=="canceled" && !isRefundPending(o));
  if(!os.length) return `<div class="empty">아직 법인(계산서) 주문이 없어요.<br><span style="font-size:12px;">계산서로 주문이 들어오면 거래처별로 여기 모입니다.</span></div>`;
  const g={};
  for(const o of os){
    const k=o.corp_regno||o.corp_name;
    (g[k]=g[k]||{nm:o.corp_name,regno:o.corp_regno,email:o.corp_email,n:0,sum:0,last:null,orders:[]});
    g[k].n++; g[k].sum+=Number(o.paid_amount||o.amount)||0;
    if(!g[k].last||String(o.created_at)>String(g[k].last)) g[k].last=o.created_at;
    g[k].orders.push(o);
  }
  const list=Object.values(g).sort((a,b)=>b.sum-a.sum);
  const fmtNo=n=>n&&n.length===10?`${n.slice(0,3)}-${n.slice(3,5)}-${n.slice(5)}`:(n||"");
  const days=d=>d?Math.floor((nowMs()-new Date(d).getTime())/86400000):null;
  return `<div style="background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;">
      <div style="font-size:13px;color:var(--ink-soft);">거래처 <b style="color:var(--ink);">${list.length}곳</b> · 법인 주문 <b style="color:var(--ink);">${os.length}건</b> · 합계 <b style="color:var(--accent-deep,#1f4733);">${won(list.reduce((s,c)=>s+c.sum,0))}</b></div>
    </div>`
    + list.map(c=>{
      const d=days(c.last);
      const cold=d!=null&&d>=60;
      return `<div class="order">
        <div class="o-top">
          <div class="o-name">${esc(c.nm)} <span class="to">${esc(fmtNo(c.regno))}</span></div>
          <div><span class="badge ${c.n>=3?'b-ordered':'b-new'}">${c.n}건</span>${cold?'<span class="badge b-urgent">뜸함</span>':''}</div>
        </div>
        <div class="o-rows">
          <div><span class="lbl">누적</span><b>${won(c.sum)}</b> · 평균 ${won(Math.round(c.sum/c.n))}</div>
          <div><span class="lbl">최근</span>${c.last?esc(String(c.last).slice(0,10)):"-"}${d!=null?` (${d}일 전)`:""}</div>
          ${c.email?`<div><span class="lbl">계산서</span>${esc(c.email)}</div>`:''}
        </div>
        <div class="o-actions">
          <button onclick="copyCorpLink('${esc(c.regno||"")}',this)">🔗 전용 주문 링크</button>
          <button onclick="copyAcctLink('${esc(c.regno||"")}',this)">📋 계정·주문내역 링크</button>
        </div>
      </div>`;
    }).join("");
}
// 거래처 전용 링크 — 총무팀이 열면 상호·사업자번호·이메일이 채워진 채로 시작한다(입력 5칸 → 0칸).
async function copyCorpLink(regno, btn){
  if(!regno){ toast("사업자번호가 없는 거래처예요.","err"); return; }
  const old=btn.textContent; btn.textContent="만드는 중…"; btn.disabled=true;
  const data = await api({ action:"corplink", regno });
  btn.disabled=false;
  if(!data || !data.url){ btn.textContent=old; return; }
  try{ await navigator.clipboard.writeText(data.url); toast("링크 복사됨 — 거래처 담당자에게 보내세요 ✓"); btn.textContent="✓ 복사됨"; }
  catch(e){ prompt("이 링크를 거래처에 보내세요:", data.url); btn.textContent=old; }
}
// 거래처 계정·주문내역 링크 — 열면 corp.html 에서 자기 회사 지난 주문·계산서 확인 + 재주문(재발급 가능 토큰).
async function copyAcctLink(regno, btn){
  if(!regno){ toast("사업자번호가 없는 거래처예요.","err"); return; }
  const old=btn.textContent; btn.textContent="만드는 중…"; btn.disabled=true;
  const data = await api({ resource:"corp", action:"acctlink", regno });
  btn.disabled=false;
  if(!data || !data.url){ btn.textContent=old; return; }
  try{ await navigator.clipboard.writeText(data.url); toast("계정 링크 복사됨 — 거래처에 보내면 주문내역을 봅니다 ✓"); btn.textContent="✓ 복사됨"; }
  catch(e){ prompt("이 계정·주문내역 링크를 거래처에 보내세요:", data.url); btn.textContent=old; }
}
// 계산서 발행완료 표시 — 거래처 대시보드에 '발행완료'로 보임(invoice_issued 컬럼 필요).
async function markInvoice(oid, btn){
  if(isRefundPending(ORDERS.find(x=>x.order_id===oid))){ toast("환불 처리 중이라 계산서 상태를 바꿀 수 없어요.","err"); return; }
  const old=btn.textContent; btn.textContent="처리 중…"; btn.disabled=true;
  const data = await api({ resource:"corp", action:"invoice", order_id:oid, issued:true });
  btn.disabled=false;
  if(!data){ btn.textContent=old; return; }
  toast("계산서 발행완료로 표시했어요 ✓"); btn.textContent="✓ 발행완료";
}

// ── 통계 ──
function statsHtml(){
  const os=ORDERS.filter(o=>o.status!=="canceled" && !isRefundPending(o));
  const canceledCnt=ORDERS.filter(o=>o.status==="canceled").length;
  const paid=os.reduce((s,o)=>s+(Number(o.paid_amount||o.amount)||0),0);
  const cnt=os.length, avg=cnt?Math.round(paid/cnt):0;
  const delivered=os.filter(o=>o.status==="delivered").length;
  const now=nowMs(); const d7=os.filter(o=>o.created_at && (now-new Date(o.created_at).getTime())<7*86400000).length;
  const ch={}; for(const o of os){ const k=o.utm_source||o.referral_source||"직접/기타"; ch[k]=(ch[k]||0)+1; }
  const cat={}; for(const o of os){ const k=o.category||o.order_type||"기타"; cat[k]=(cat[k]||0)+1; }
  const top=(obj)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const bars=(arr)=>{ const max=Math.max(1,...arr.map(x=>x[1])); return arr.map(([k,v])=>`<div style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;"><div style="width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft);">${esc(k)}</div><div style="flex:1;background:#f0ece3;border-radius:4px;height:15px;"><div style="width:${Math.round(v/max*100)}%;background:var(--accent);height:15px;border-radius:4px;"></div></div><div style="width:26px;text-align:right;font-weight:700;">${v}</div></div>`).join(""); };
  const cell=(n,l)=>`<div style="flex:1;"><div style="font-size:19px;font-weight:800;font-family:var(--font-display,inherit);">${n}</div><div style="font-size:11px;color:var(--ink-soft);margin-top:2px;">${l}</div></div>`;
  return `<div style="background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;">
    <div style="display:flex;gap:8px;text-align:center;">${cell(won(paid),"총 매출(결제액)")}${cell(cnt,"주문 수")}${cell(won(avg),"평균 객단가")}</div>
    <div style="display:flex;gap:8px;text-align:center;margin-top:14px;">${cell(d7,"최근 7일 주문")}${cell(delivered,"배송완료")}${cell(canceledCnt,"취소·환불")}</div>
    ${cnt?`<div style="font-size:13px;font-weight:800;margin-top:18px;">유입 채널</div>${bars(top(ch))}<div style="font-size:13px;font-weight:800;margin-top:16px;">상품 종류</div>${bars(top(cat))}`:'<div style="text-align:center;color:var(--ink-faint);padding:20px 0;font-size:13px;">주문이 쌓이면 매출·유입채널·인기상품 통계가 여기 나와요.</div>'}
  </div>`;
}

async function setStatus(orderId, status){
  const current=ORDERS.find(x=>x.order_id===orderId);
  if(isRefundPending(current)){ toast("환불 처리 중이라 상태를 바꿀 수 없어요.","err"); return; }
  const data = await api({ action:"status", orderId, status });
  if(!data) return;
  const o = ORDERS.find(x=>x.order_id===orderId);
  if(o){ o.status=status; if(status==="delivered") o.completed_at=o.completed_at||new Date().toISOString(); }
  render();
  toast(status==="delivered"?"배송완료로 표시했어요 ✓":"만드는 중으로 표시했어요 ✓");
}

// 무통장 '입금 확인' — 접수로 넘기고 사장님 단톡에 '발주하세요', 손님에게 입금 확인 문자.
async function depositOrder(orderId, btn){
  const o = ORDERS.find(x=>x.order_id===orderId);
  if(!confirm(`통장에 ${o ? Number(o.paid_amount||o.amount||0).toLocaleString()+"원이" : "입금이"} 들어온 걸 확인하셨나요?\n\n확인하면 접수로 넘어가고 손님에게 입금 확인 문자가 갑니다.`)) return;
  btn.disabled = true;
  const data = await api({ action:"deposit", orderId });
  btn.disabled = false;
  if(!data) return;
  if(o) o.status = "new";
  render();
  toast("입금 확인했어요 — 접수로 넘겼어요 ✓");
}
// 입금 전 주문 닫기 — 돈이 안 들어왔으니 환불할 것이 없다.
async function voidOrder(orderId, btn){
  if(!confirm("입금이 안 된 이 주문을 취소할까요?\n\n(입금이 이미 됐다면 취소하지 말고 '입금 확인'을 눌러주세요)")) return;
  btn.disabled = true;
  const data = await api({ action:"void", orderId });
  btn.disabled = false;
  if(!data) return;
  const o = ORDERS.find(x=>x.order_id===orderId); if(o) o.status = "canceled";
  render();
  toast("주문을 취소했어요");
}

async function cancelOrder(orderId, btn){
  const o = ORDERS.find(x=>x.order_id===orderId);
  const amt = o ? won(o.paid_amount||o.amount) : "";
  if(!confirm(`이 주문(${amt})의 결제를 취소(전액 환불)할까요?`)) return;
  if(!confirm("정말요? 되돌릴 수 없습니다. 손님 카드로 환불됩니다.")) return;
  const old=btn.textContent; btn.textContent="환불 중…"; btn.disabled=true;
  let data=null;
  try{ data = await api({ action:"cancel", orderId }); }
  catch(e){ toast("네트워크 오류 — 환불이 됐는지 새로고침으로 확인해주세요","err"); }
  btn.disabled=false; btn.textContent=old;
  if(!data){ await load(); return; }
  if(data.pending){ if(o) o.cancel_requested_at=new Date().toISOString(); render(); toast("환불을 확인 중이에요. 결과 전까지 주문 작업을 잠갔어요."); return; }
  if(o){ o.status="canceled"; o.canceled_at=new Date().toISOString(); }
  render();
  if(data.alreadyCanceled) toast("이미 취소된 결제였어요 — 목록만 정리했어요");
  else toast(`✓ 결제취소 완료 — ${data.amount?data.amount.toLocaleString()+"원 ":""}환불 처리됐어요`+(data.dbSynced===false?" (목록 갱신 실패 — 새로고침)":""));
}

async function copyLink(orderId, btn){
  if(isRefundPending(ORDERS.find(x=>x.order_id===orderId))){ toast("환불 처리 중이라 기사 링크를 만들 수 없어요.","err"); return; }
  const old=btn.textContent; btn.textContent="링크 만드는 중…"; btn.disabled=true;
  const data = await api({ action:"link", orderId });
  btn.disabled=false;
  if(!data || !data.url){ btn.textContent=old; return; }
  try{ await navigator.clipboard.writeText(data.url); toast("링크 복사됨 — 배달 기사/파트너에게 카톡으로 보내세요 ✓"); btn.textContent="✓ 복사됨"; }
  catch(e){ prompt("이 링크를 복사해 기사에게 보내세요:", data.url); btn.textContent=old; }
}
async function viewPhoto(orderId, btn){
  if(isRefundPending(ORDERS.find(x=>x.order_id===orderId))){ toast("환불 처리 중인 주문은 사진 작업을 잠갔어요.","err"); return; }
  btn.textContent="여는 중…"; btn.disabled=true;
  const data = await api({ action:"photo", orderId });
  if(!data || !data.url){ btn.textContent="📷 올린 사진 보기"; btn.disabled=false; return; }
  btn.parentElement.innerHTML = `<img src="${data.url}" alt="배송완료 사진" style="max-width:170px;border-radius:8px;">`;
}
async function resendPhoto(orderId, btn){
  if(isRefundPending(ORDERS.find(x=>x.order_id===orderId))){ toast("환불 처리 중이라 고객 문자를 보낼 수 없어요.","err"); return; }
  // 다시 보내면 새 링크가 만들어지고, 이미 손님께 보낸 링크는 더 이상 열리지 않는다.
  if(!confirm("새 사진 링크를 만들어요.\n이미 손님께 보낸 링크가 있다면 그 링크는 더 이상 열리지 않아요.\n새 링크를 손님께 보내실 거면 '확인'을 눌러 주세요.")) return;
  const old=btn.textContent; btn.textContent="보내는 중…"; btn.disabled=true;
  try{
    const r=await afAdmin.fetch("/api/order-photo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"notify",orderId})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||"문자를 보내지 못했어요.");
    const o=ORDERS.find(x=>x.order_id===orderId); if(o) o.photo_notice_status=d.notice&&d.notice.status||"failed";
    if(d.notice&&d.notice.status==="sent"){
      render(); toast("고객에게 사진 링크를 다시 보냈어요 ✓");
    }else if(d.manualLink){
      try{ await navigator.clipboard.writeText(d.manualLink); render(); toast("고객용 링크를 복사했어요. 주문자에게 문자나 카카오톡으로 보내주세요.","err"); }
      catch(_e){ prompt("이 링크를 복사해 주문자에게 문자나 카카오톡으로 보내세요:",d.manualLink); render(); }
    }else{
      render(); toast("사진은 유지됐지만 문자를 보내지 못했어요.","err");
    }
  }catch(e){ toast("❌ "+(e.message||"문자 재전송 실패"),"err"); btn.disabled=false; btn.textContent=old; }
}

let toastT=null;
function toast(msg,type){ const t=$("toast"); t.textContent=msg; t.className="toast show"+(type==="err"?" err":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",2200); }

afAdmin.ready.then(a=>{ if(a) load(); });
</script>
