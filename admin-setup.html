<!DOCTYPE html>
<html lang="ko" data-admin-role="owner">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>설정 점검 — 꽃안부 관리자</title>
<link rel="stylesheet" href="/tokens.css" />
<!--
  설정 점검(2026-10-07, 11/2 새 화면 — 시안 docs/시안/설정점검-2026-11) — 사이트가 손님·사장님께 제대로 일하는지 한눈에.
  서버: api/admin.js resource "setup" (check · sms-test), 판정: lib/setup-status.mjs(setupStatus·opsStatus). 값(키·번호)은 안 온다.
  검색 등록 파일은 이 화면이 같은 사이트에서 직접 열어 본다.
  환경변수를 바꾼 뒤에는 Vercel 에서 Redeploy 해야 여기에도 반영된다.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{--red:#a03a2c;--red-soft:#fbe9e5;--amber:#85590c;--amber-soft:#fbf0d8;--chip:#f1efe8;--bubble:#eef0ec;}
  body{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif);background:var(--bg);color:var(--ink);line-height:1.6;font-size:15px;padding:0 0 48px;}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px;display:grid;gap:22px;}
  h1{font-family:var(--font-display,serif);font-size:26px;margin-top:14px;}
  h2{font-size:17px;font-weight:800;margin-bottom:10px;}
  h3{font-size:17px;}
  h4{font-size:14px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;}
  h4 span{font-size:12.5px;font-weight:600;color:var(--ink-faint);}
  .sub{font-size:14px;color:var(--ink-soft);margin-top:2px;}
  .ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
  .glance{display:grid;gap:8px;margin-top:12px;}
  .g{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--paper);border:1px solid var(--line);}
  .g .ic{width:30px;height:30px;padding:6px;box-sizing:content-box;border-radius:10px;}
  .g b{display:block;font-size:15px;} .g span{font-size:13px;color:var(--ink-soft);}
  .g em{font-style:normal;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .red .ic.tone,.g.red .ic,.g.red em{background:var(--red-soft);color:var(--red);}
  .g.amber .ic,.g.amber em{background:var(--amber-soft);color:var(--amber);}
  .g.green .ic,.g.green em{background:var(--accent-soft);color:var(--accent);}
  .g.red{border-color:var(--red);}
  .fixes{display:grid;gap:12px;}
  .fix{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;}
  .fix.red{border-color:var(--red);}
  .fx-hd{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;}
  .num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--red);}
  .fix.amber .num{background:var(--amber);}
  .fx-hd p{font-size:14px;color:var(--ink-soft);margin-top:4px;} .fx-hd p b{color:var(--ink);}
  .fx-body{display:grid;gap:14px;}
  .ill{display:grid;gap:6px;justify-items:center;}
  .ill .cap{font-size:12.5px;color:var(--ink-faint);text-align:center;}
  .phone{position:relative;width:210px;border:2px solid var(--ink);border-radius:22px;padding:10px 10px 16px;background:var(--bg);display:grid;gap:8px;}
  .phone .bar{font-size:11px;color:var(--ink-faint);text-align:center;}
  .bub{font-size:12px;line-height:1.5;background:var(--bubble);border-radius:12px 12px 12px 4px;padding:8px 10px;}
  .bub.ghost{opacity:.55;}
  .stamp{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);font-weight:800;font-size:15px;color:var(--red);border:2.5px solid var(--red);padding:4px 12px;border-radius:8px;background:var(--paper);white-space:nowrap;}
  .pay{width:230px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:grid;gap:6px;font-size:13px;}
  .pay .row{display:flex;justify-content:space-between;}
  .pay .cross b{text-decoration:line-through;color:var(--red);} .pay .cross span{color:var(--red);}
  .pay .lock{display:flex;gap:6px;align-items:center;font-weight:800;color:var(--accent);font-size:12.5px;border-top:1px dashed var(--line);padding-top:8px;}
  .steps{list-style:none;display:grid;gap:8px;counter-reset:s;}
  .steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);}
  .steps li .ic{grid-row:span 2;color:var(--accent);width:26px;height:26px;}
  .steps li b{font-size:14px;} .steps li b::before{content:counter(s) ". ";color:var(--ink-faint);}
  .steps li span{font-size:12.5px;color:var(--ink-soft);}
  .how{display:grid;gap:10px;min-width:0;}
  .calm{font-size:13px;color:var(--accent);}
  .btn{display:block;text-align:center;padding:11px 16px;border-radius:10px;font-weight:800;font-size:14px;border:1px solid var(--accent);color:var(--accent);background:var(--paper);text-decoration:none;cursor:pointer;font-family:inherit;width:100%;}
  .btn.fill{background:var(--accent);color:#fff;}
  .btn:disabled{opacity:.5;cursor:default;}
  .techd summary{font-size:12.5px;color:var(--ink-faint);cursor:pointer;}
  .techd p{font-size:12px;margin-top:4px;}
  code{font-size:12px;background:var(--chip);padding:1px 6px;border-radius:5px;overflow-wrap:anywhere;}
  .allok{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:14px 16px;font-weight:700;}
  .lower,.col{display:grid;gap:22px;align-content:start;min-width:0;}
  .box{background:var(--paper);border:1px solid var(--line);border-radius:12px;}
  .o{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);}
  .o:first-child{border-top:0;}
  .o .ic{color:var(--ink-soft);}
  .o b{display:block;font-size:14px;} .o span{font-size:12.5px;color:var(--ink-soft);}
  .st{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .st.ok{background:var(--accent-soft);color:var(--accent);} .st.bad{background:var(--red-soft);color:var(--red);}
  .st.mid{background:var(--amber-soft);color:var(--amber);} .st.off{background:var(--chip);color:var(--ink-soft);}
  .fgrid{display:grid;gap:8px;}
  .f{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;align-content:start;}
  .f-top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;}
  .f-top .ic{color:var(--ink-soft);} .f-top b{font-size:15px;word-break:keep-all;}
  .f p{font-size:13.5px;color:var(--ink-soft);} .f .cond{font-size:12.5px;color:var(--ink-faint);}
  .tools{display:grid;gap:8px;}
  .uid{font-size:12px;color:var(--ink-faint);overflow-wrap:anywhere;}
  .links{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;padding:10px 14px;border-top:1px solid var(--line);}
  .links a{color:var(--accent);font-weight:700;text-decoration:none;}
  .navlink{font-size:13px;color:var(--accent);text-decoration:none;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;}
  .toast.show{opacity:1;} .toast.err{background:var(--red);}
  /* 컴퓨터: 한눈에 4칸 가로, 고칠 것은 그림 왼쪽 + 단계 가로, 아래는 두 칸 */
  @media (min-width:1000px){
    .wrap{max-width:1180px;padding:0 40px;gap:30px;}
    h1{font-size:32px;margin-top:18px;}
    .glance{grid-template-columns:repeat(4,1fr);gap:12px;}
    .g{padding:16px;grid-template-columns:auto 1fr;}
    .g em{grid-column:1/-1;justify-self:start;}
    .fix{padding:22px 24px;}
    .fx-body{grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start;}
    .steps{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
    .steps li{grid-template-columns:1fr;justify-items:start;align-content:start;padding:14px;gap:6px;}
    .steps li .ic{grid-row:auto;width:30px;height:30px;}
    .fix .btn{width:auto;justify-self:start;padding:11px 22px;}
    .lower{grid-template-columns:minmax(0,1fr) 360px;gap:30px;align-items:start;}
    .fgrid{grid-template-columns:repeat(2,1fr);gap:12px;}
  }
  @media (min-width:1440px){ .fgrid{grid-template-columns:repeat(3,1fr);} }
  /* 관리자 새 틀 */
  @media (min-width:1000px){ header{text-align:left;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>설정 점검</h1>
    <div class="sub">사이트가 손님·사장님께 제대로 일하고 있는지 한눈에 보는 곳이에요. 비밀번호 같은 값은 보이지 않아요.</div>
    <div class="glance" id="glance"><div class="g"><span>불러오는 중…</span></div></div>
  </header>
  <section id="fixSec"></section>
  <div class="lower">
    <div class="col"><section id="opsSec"></section><section id="featSec"></section></div>
    <div class="col"><section id="seoSec"></section><section id="okSec"></section></div>
  </div>
  <a class="navlink" href="/admin-orders.html">← 주문 관리</a>
</div>
<div class="toast" id="toast"></div>

<script src="/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin-auth.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT=null;
function toast(msg,type){ const t=$("toast"); t.textContent=msg; t.className="toast show"+(type==="err"?" err":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",2600); }
async function api(payload){
  const r = await afAdmin.fetch("/api/admin", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({resource:"setup", ...payload}) });
  const data = await r.json().catch(()=>({}));
  return { ok:r.ok, status:r.status, data };
}
const VERCEL_ENV = "https://vercel.com/hg0516s-projects/amazonflower/settings/environment-variables";
// 선 아이콘(24칸)
const I = {
  msg:'<path d="M4 5h16v11H9l-5 4z"/>',
  shield:'<path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  gift:'<rect x="3" y="9" width="18" height="12" rx="1"/><path d="M3 13h18M12 9v12"/><path d="M12 9C9 9 7 7.5 8 6s4 1 4 3c0-2 3-4.5 4-3s-1 3-4 3z"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  bank:'<path d="M3 10l9-6 9 6"/><path d="M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18"/>',
  swap:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
  cash:'<rect x="3" y="6" width="18" height="12" rx="1"/><circle cx="12" cy="12" r="2.5"/>',
  share:'<path d="M12 4C7 4 3 7 3 11c0 2.5 1.6 4.6 4 5.9L6 20l4-2.2c.6.1 1.3.2 2 .2 5 0 9-3 9-7s-4-7-9-7z"/>',
  person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  undo:'<path d="M9 7H4V2"/><path d="M4 7a9 9 0 1 1-1 6"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l2 2M15 8l2 2"/>',
  paste:'<rect x="6" y="4" width="12" height="17" rx="1"/><path d="M9 4V2h6v2M9 11h6M9 15h6"/>',
  id:'<rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.8-1.5 2-2 3-2s2.2.5 3 2M14 10h4M14 13h4"/>',
  bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  card:'<rect x="3" y="6" width="18" height="12" rx="1"/><path d="M3 10h18M7 15h4"/>',
  apple:'<path d="M15 4c-1 0-2.5 1-2.5 2.5M12 8c-2-1.5-6-1-6 4 0 4 2.5 8 4 8 1 0 1.5-.5 2-.5s1 .5 2 .5c1.5 0 4-4 4-8 0-5-4-5.5-6-4z"/>',
  map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  robot:'<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01"/>',
  bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
};
const ic = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${I[n]||""}</svg>`;
const steps = list => `<ol class="steps">${list.map(([i,t,d])=>`<li>${ic(i)}<b>${esc(t)}</b><span>${esc(d)}</span></li>`).join("")}</ol>`;
function ago(iso){
  const t = Date.parse(iso||""); if(!isFinite(t)) return "";
  const m = Math.round((Date.now()-t)/60000);
  if (m < 1) return "방금"; if (m < 60) return m+"분 전";
  const h = Math.round(m/60); if (h < 24) return h+"시간 전";
  const d = new Date(t); return (d.getMonth()+1)+"월 "+d.getDate()+"일";
}
const row = (icon, title, sub, st, label) => `<div class="o">${ic(icon)}<div><b>${esc(title)}</b>${sub?`<span>${esc(sub)}</span>`:""}</div><span class="st ${st}">${esc(label)}</span></div>`;

// 검색 등록 파일은 같은 사이트에서 직접 열어 본다(서버 함수에 정적 파일이 없어서).
async function seoCheck(){
  const get = async (p) => { try { const r = await fetch(p, { cache:"no-store" }); return r.ok ? await r.text() : null; } catch { return null; } };
  const [robots, sitemap, google, naver, indexnow] = await Promise.all([
    get("/robots.txt"), get("/sitemap.xml"), get("/google7eb23ff2399230a7.html"), get("/naver565a60d50d8028a15b02475fdc0c6373.html"), get("/ee2cd8520bb991b947a381fbde67298a.txt")]);
  return {
    robots: robots != null && !/^\s*Disallow:\s*\/\s*$/m.test(robots),
    pages: sitemap ? (sitemap.match(/<loc>/g)||[]).length : 0,
    google: !!(google && /google-site-verification/.test(google)),
    naver: !!(naver && /naver-site-verification/.test(naver)),
    indexnow: !!(indexnow && indexnow.trim().length >= 8),
  };
}

function render(s, me, ops, seo){
  ops = ops || {};
  const sms = s.sms.ready, intents = s.payment.intentsRequired, tg = s.telegram, pm = s.payment;
  const recAge = Date.parse(ops.reconcileOkAt||"") ? (Date.now()-Date.parse(ops.reconcileOkAt))/60000 : null;
  const recBad = ops.reconcileOkAt ? (recAge > 30 || !!ops.reconcileError) : false;
  const tossTest = s.tossMode === "test" || s.tossMode === "none";
  const seoAll = seo && seo.robots && seo.pages > 0 && seo.google && seo.naver;
  const appleDays = Math.ceil((Date.parse(s.login.appleExpiry+"T00:00:00+09:00") - Date.now())/86400000);

  // 한눈에 네 칸
  const g = [];
  g.push(sms ? ["green","msg","손님 문자","주문하신 분께 문자가 가요","괜찮아요"] : ["red","msg","손님 문자","주문하신 분 휴대폰으로 문자가 안 가요","고쳐야 해요"]);
  g.push(tossTest ? ["red","shield","결제","시험 결제 모드예요. 진짜 돈이 안 들어와요","고쳐야 해요"]
    : recBad ? ["red","shield","결제","결제 자동 점검이 멈춘 것 같아요","고쳐야 해요"]
    : !intents ? ["amber","shield","결제 안전장치","설정 하나만 켜면 더 안전해져요","켜 주세요"]
    : ["green","shield","결제","실제 결제가 안전하게 되고 있어요","괜찮아요"]);
  g.push(tg ? ["green","bell","새 주문 알림", ops.lastOrderAt ? `텔레그램으로 와요 · 마지막 주문 ${ago(ops.lastOrderAt)}` : "텔레그램으로 와요","괜찮아요"] : ["red","bell","새 주문 알림","새 주문 알림이 아무 데도 안 가요","고쳐야 해요"]);
  g.push(!seo ? ["amber","search","검색에 나오기","확인하는 중이에요","확인 중"] : seoAll ? ["green","search","검색에 나오기","구글·네이버에 나올 준비가 됐어요","괜찮아요"] : ["amber","search","검색에 나오기","빠진 등록이 있어요. 아래를 봐 주세요","봐 주세요"]);
  $("glance").innerHTML = g.map(([tone,i,t,d,l])=>`<div class="g ${tone}">${ic(i)}<div><b>${esc(t)}</b><span>${esc(d)}</span></div><em>${esc(l)}</em></div>`).join("");

  // 지금 고칠 것
  const fixes = [];
  if (!tg) fixes.push(["red", "새 주문 알림 연결", "새 주문이 들어와도 <b>아무 데도 알림이 안 가요.</b> 바로 넣어야 해요.", "", `<div class="how"><h4>이렇게 하면 돼요 <span>형구</span></h4>${steps([["bell","텔레그램 봇 정보 넣기","봇 토큰과 방 번호를 사이트 설정 창고에 넣어요."],["undo","다시 배포","Vercel 화면의 Redeploy 버튼을 눌러요."]])}<details class="techd"><summary>기술 이름 보기</summary><p><code>TELEGRAM_BOT_TOKEN</code> <code>TELEGRAM_CHAT_ID</code></p></details></div>`]);
  if (tossTest) fixes.push(["red", "실제 결제로 바꾸기", "지금 결제 키가 <b>시험용</b>이에요. 손님이 결제해도 돈이 들어오지 않아요.", "", `<div class="how"><h4>이렇게 하면 돼요 <span>형구에게 바로 알려 주세요</span></h4></div>`]);
  if (recBad) fixes.push(["red", "결제 자동 점검이 멈췄어요", `결제가 됐는데 주문이 안 남는 일을 5분마다 고쳐 주는 장치예요. 마지막으로 돈 게 <b>${esc(ago(ops.reconcileOkAt))}</b>예요.`, "", `<div class="how"><h4>이렇게 하면 돼요</h4><p class="calm">형구에게 알려 주세요. 그 사이 새 주문은 텔레그램 알림과 주문 관리 화면을 한 번 더 봐 주세요.</p></div>`]);
  if (!sms) fixes.push(["red", "손님에게 문자 보내기", "지금은 주문 확인, 배송 사진, 꽃 선물 링크 문자가 <b>하나도 안 가요.</b> 손님은 텔레그램을 못 보니까 주문이 됐는지 몰라요.",

async function load(){
  const [r, seo] = await Promise.all([api({ action:"check" }), seoCheck().catch(()=>null)]);
  if (!r.ok) { $("glance").innerHTML = `<div class="g red"><span>${esc(r.data.error || "불러오지 못했어요")}</span></div>`; return; }
  render(r.data.setup, r.data.me, r.data.ops, seo);
}
afAdmin.ready.then(a=>{ if(a) load(); });
