<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주문 조회 — 꽃안부</title>
<meta name="description" content="주문번호와 연락처 뒷 4자리로 주문 상태와 도착 사진을 확인하세요.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/a11y.css">
<style>
  /* 비회원 주문 조회. 회원가입 없이 주문한 손님이 완료 화면을 닫고 나면 주문번호도 영수증도
     전화로 물어야 했다(벤치마크 9곳 중 4곳이 이 페이지를 갖고 있다).
     조회는 Supabase RPC(lookup_order) 하나로 처리 — Vercel 12함수 제한 때문. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.7; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px 80px; }

  header { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid var(--line-soft); margin: 0 -20px; padding: 14px 20px 10px; }
  .hdr-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--ink); text-decoration: none; }
  .hdr-tel { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; min-height: 48px; justify-content: center; padding: 4px 10px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--paper); text-decoration: none; }
  .hdr-tel .ht-num { font-family: var(--font-display); font-size: var(--fs-price); font-weight: 800; color: var(--accent-deep); white-space: nowrap; }
  .hdr-tel .ht-sub { font-size: var(--fs-label); color: var(--ink-faint); white-space: nowrap; }

  h1 { font-family: var(--font-display); font-size: var(--fs-h2); font-weight: 700; margin: 24px 0 6px; }
  .sub { font-size: var(--fs-sub); color: var(--ink-soft); margin-bottom: 18px; word-break: keep-all; }

  .card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px 18px; }
  label.fl { display: block; font-size: var(--fs-sub); font-weight: 700; color: var(--ink); margin: 14px 0 6px; }
  label.fl:first-of-type { margin-top: 0; }
  label.fl .hint { font-weight: 400; color: var(--ink-faint); font-size: var(--fs-caption); }
  input { width: 100%; font-size: 17px; font-family: var(--font-body); padding: 14px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: #fcfbf8; color: var(--ink); }
  input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .btn { width: 100%; min-height: 54px; margin-top: 18px; padding: 15px; border: none; border-radius: var(--radius); background: var(--accent); color: #fff; font-size: 17px; font-weight: 800; font-family: var(--font-body); cursor: pointer; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn-ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .err { display: none; margin-top: 14px; padding: 13px 15px; background: var(--danger-soft, #f7e9e7); border: 1px solid var(--danger); border-radius: var(--radius); color: var(--danger); font-size: var(--fs-sub); line-height: 1.6; }
  .err.on { display: block; }
  .err a { color: var(--danger); font-weight: 700; }

  /* 결과 */
  .res { margin-top: 18px; }
  .res-head { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg) var(--radius-lg) 0 0; border-bottom: none; padding: 18px; }
  .res-oid { font-size: var(--fs-caption); color: var(--ink-faint); }
  .res-prod { font-family: var(--font-display); font-size: 21px; font-weight: 700; margin-top: 2px; word-break: keep-all; }
  .res-amt { font-size: var(--fs-price); font-weight: 800; color: var(--accent-deep); margin-top: 4px; font-variant-numeric: tabular-nums; }

  /* 상태 타임라인 — ol/li + aria-current로 스크린리더에도 현재 단계를 알린다. */
  .tl { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 0; padding: 18px 12px 16px; background: var(--paper); border: 1px solid var(--line); border-top: 1px dashed var(--line); }
  .tl li { position: relative; text-align: center; font-size: var(--fs-caption); font-weight: 700; color: var(--ink-faint); padding-top: 16px; word-break: keep-all; }
  .tl li::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--line); }
  .tl li:first-child::before { border-radius: 2px 0 0 2px; }
  .tl li:last-child::before { border-radius: 0 2px 2px 0; }
  .tl li.done::before, .tl li.now::before { background: var(--accent); }
  .tl li::after { content: ""; position: absolute; top: -4px; left: calc(50% - 5px); width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
  .tl li.done::after { background: var(--accent); }
  .tl li.now::after { background: var(--paper); border: 3px solid var(--accent); }
  .tl li.now { color: var(--accent-deep); }
  .tl li small { display: block; font-weight: 400; color: var(--ink-faint); font-size: var(--fs-label); margin-top: 1px; }
  .tl.canceled li::before, .tl.canceled li::after { background: var(--line) !important; border-color: var(--line) !important; }

  .rows { background: var(--paper); border: 1px solid var(--line); border-top: none; border-radius: 0 0 var(--radius-lg) var(--radius-lg); padding: 4px 18px 16px; }
  .row { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line-soft); font-size: var(--fs-sub); }
  .row:first-child { border-top: none; }
  .row .k { color: var(--ink-faint); font-size: var(--fs-caption); padding-top: 2px; }
  .row .v { color: var(--ink); word-break: keep-all; }
  .banner { margin-top: 12px; padding: 14px 16px; border-radius: var(--radius); font-size: var(--fs-sub); line-height: 1.65; word-break: keep-all; }
  .banner.ok { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--accent-deep); }
  .banner.warn { background: #fff7e5; border: 1px solid var(--gold); color: #6f4a08; }
  .banner.off { background: #f7f7f3; border: 1px solid var(--line); color: var(--ink-soft); }
  .acts { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .acts a, .acts button { flex: 1 1 140px; min-height: 50px; display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-size: var(--fs-sub); font-weight: 700; font-family: var(--font-body); text-decoration: none; cursor: pointer; }
  .acts .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .foot-note { margin-top: 16px; font-size: var(--fs-caption); color: var(--ink-faint); line-height: 1.7; text-align: center; }
  .foot-note a { color: var(--accent-deep); font-weight: 700; white-space: nowrap; }

  @media (min-width: 1000px) {
    body { background: var(--bg-desk); }
    .wrap { background: var(--paper); box-shadow: 0 0 0 1px var(--line-soft); padding: 0 28px 40px; min-height: 100vh; }
    header { margin: 0 -28px; padding-left: 28px; padding-right: 28px; }
  }
  @media (max-width: 380px) { .hdr-tel .ht-num { font-size: 17px; } }
</style>
<script src="/supabase-config.js"></script>
<script src="/footer.js" defer></script>
<script src="/bottom-nav.js" defer></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hdr-row">
      <a class="brand" href="/">꽃안부</a>
      <a class="hdr-tel" href="tel:031-314-3003">
        <span class="ht-num">031-314-3003</span>
        <span class="ht-sub">전화 주문 · 상담</span>
      </a>
    </div>
  </header>

  <h1>주문 조회</h1>
  <p class="sub">주문번호와 연락처 뒷 4자리를 넣으면 지금 어디까지 왔는지 보여드려요. 회원가입은 필요 없습니다.</p>

  <div class="card" id="form">
    <label class="fl" for="oid">주문번호 <span class="hint">— 주문 후 받으신 문자에 있어요</span></label>
    <input id="oid" type="text" inputmode="latin" autocapitalize="characters" autocomplete="off" placeholder="예: AF20260916-3K7Q" enterkeyhint="next">
    <label class="fl" for="ph">연락처 뒷 4자리 <span class="hint">— 주문하신 분 휴대폰</span></label>
    <input id="ph" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000" enterkeyhint="search">
    <button class="btn" id="go">주문 찾기</button>
    <div class="err" id="err"></div>
  </div>

  <div class="res" id="res" hidden></div>

  <p class="foot-note">주문번호를 잃어버리셨어도 괜찮아요.<br><a href="tel:031-314-3003">031-314-3003</a> 으로 전화 주시면 찾아드립니다.</p>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var won = function (n) { return Number(n || 0).toLocaleString() + "원"; };

  function showErr(html) {
    var e = $("err");
    e.innerHTML = html;
    e.classList.add("on");
  }
  function clearErr() { $("err").classList.remove("on"); }

  // 날짜 표기 — "9월 16일 (수)". 연도는 올해가 아닐 때만 붙인다.
  var WD = ["일", "월", "화", "수", "목", "금", "토"];
  function fmtDate(iso) {
    if (!iso) return "";
    var m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return String(iso);
    var d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    var y = d.getFullYear() === new Date().getFullYear() ? "" : m[1] + "년 ";
    return y + Number(m[2]) + "월 " + Number(m[3]) + "일 (" + WD[d.getDay()] + ")";
  }
  function fmtStamp(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    if (isNaN(d.getTime())) return "";
    return (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  var SLOT = { today: "당일중", am: "오전중", pm: "오후중", custom: "" };
  function fmtTime(o) {
    var t = o.event_time || "";
    var s = SLOT[o.delivery_time_slot];
    if (s) return s;
    return t;
  }

  // 무통장(관리자 등록) 주문은 토스 결제가 아니라 표시를 달리한다.
  function payLabel(m) {
    if (!m) return "";
    if (m === "MANUAL_BANK") return "계좌이체 · 무통장";
    return ({ CARD: "카드", TRANSFER: "계좌이체", VIRTUAL_ACCOUNT: "가상계좌",
              MOBILE_PHONE: "휴대폰", EASY_PAY: "간편결제", 간편결제: "간편결제", 카드: "카드" })[m] || m;
  }

  function render(o) {
    var canceled = !!o.canceled_at || o.status === "canceled";
    // 단계: 접수 → 준비중 → 배송·도착 → 도착사진
    var step = canceled ? -1
      : o.completed_at ? 3
      : o.ordered_at ? 2
      : 1;
    var steps = [
      ["주문 접수", fmtStamp(o.created_at)],
      ["준비 중", fmtStamp(o.ordered_at)],
      ["배송·도착", fmtStamp(o.completed_at)],
      ["도착 사진", o.has_photo ? "보내드렸어요" : ""]
    ];
    var tl = steps.map(function (s, i) {
      var n = i + 1;
      var cls = canceled ? "" : (n < step ? "done" : n === step ? "now" : "");
      if (!canceled && o.has_photo && n === 4) cls = "done";
      return '<li class="' + cls + '"' + (cls === "now" ? ' aria-current="step"' : "") + '>'
        + esc(s[0]) + (s[1] ? "<small>" + esc(s[1]) + "</small>" : "<small>&nbsp;</small>") + "</li>";
    }).join("");

    var rows = "";
    function row(k, v) { if (v) rows += '<div class="row"><span class="k">' + k + '</span><span class="v">' + v + "</span></div>"; }
    var when = [fmtDate(o.event_date), fmtTime(o)].filter(Boolean).join(" · ");
    row("받는 날", esc(when));
    row("받는 분", esc(o.recipient_name || ""));
    row("받는 곳", esc(o.venue || ""));
    row("리본", esc(o.ribbon || ""));
    row("결제", esc(payLabel(o.payment_method)));
    row("주문자", esc(o.sender_phone_masked || ""));

    var banner = canceled
      ? '<div class="banner off"><b>취소된 주문이에요.</b><br>환불은 결제하신 수단으로 처리됩니다. 궁금한 점은 031-314-3003 으로 연락 주세요.</div>'
      : o.has_photo
        ? '<div class="banner ok"><b>배송이 끝났습니다.</b><br>도착 사진을 주문하신 번호로 보내드렸어요. 못 받으셨으면 전화 주세요.</div>'
        : o.completed_at
          ? '<div class="banner ok"><b>배송이 끝났습니다.</b><br>도착 사진을 곧 보내드려요.</div>'
          : o.payment_method === "MANUAL_BANK"
            ? '<div class="banner warn"><b>입금 확인 후 준비를 시작합니다.</b><br>기업은행 169-165982-04-018 (주)아마존 · 입금 확인은 9시~19시에 합니다.</div>'
            : '<div class="banner ok"><b>사장님이 확인하고 준비합니다.</b><br>안부가 닿으면 도착 사진을 문자로 보내드려요.</div>';

    var acts = '<div class="acts">'
      + (o.receipt_url ? '<a href="' + esc(o.receipt_url) + '" target="_blank" rel="noopener">영수증 보기</a>' : "")
      + '<a class="primary" href="tel:031-314-3003">전화로 문의</a>'
      + "</div>";

    $("res").innerHTML =
      '<div class="res-head">'
      + '<div class="res-oid">주문번호 ' + esc(o.order_id) + "</div>"
      + '<div class="res-prod">' + esc(o.product_label || "주문") + "</div>"
      + '<div class="res-amt">' + won(o.amount) + "</div>"
      + "</div>"
      + '<ol class="tl' + (canceled ? " canceled" : "") + '">' + tl + "</ol>"
      + '<div class="rows">' + rows + "</div>"
      + banner + acts;
    $("res").hidden = false;
    $("res").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function lookup() {
    clearErr();
    var oid = $("oid").value.trim().toUpperCase();
    var last4 = $("ph").value.replace(/[^0-9]/g, "");
    if (!oid) { showErr("주문번호를 넣어주세요."); $("oid").focus(); return; }
    if (last4.length !== 4) { showErr("연락처 뒷 4자리를 넣어주세요."); $("ph").focus(); return; }
    if (!window.SUPA || !window.SUPA.url) { showErr("지금은 조회가 어려워요. 031-314-3003 으로 연락 주세요."); return; }

    var btn = $("go");
    btn.disabled = true; btn.textContent = "찾는 중…";
    $("res").hidden = true;

    fetch(window.SUPA.url + "/rest/v1/rpc/lookup_order", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: window.SUPA.anon, Authorization: "Bearer " + window.SUPA.anon },
      body: JSON.stringify({ p_order_id: oid, p_phone_last4: last4 })
    })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("http_" + r.status)); })
      .then(function (rows) {
        var o = Array.isArray(rows) ? rows[0] : rows;
        if (!o || !o.order_id) {
          // 없는 주문과 번호 불일치를 구분하지 않는다(주문번호 대입으로 존재 여부를 캐낼 수 없게).
          showErr("주문번호나 연락처가 맞지 않아요. 문자에 적힌 번호를 다시 확인해주세요.<br>전화로 주문하셨다면 <a href=\"tel:031-314-3003\">031-314-3003</a> 으로 문의해주세요.");
          return;
        }
        render(o);
      })
      .catch(function () {
        showErr("지금은 조회가 어려워요. 잠시 후 다시 시도하시거나 <a href=\"tel:031-314-3003\">031-314-3003</a> 으로 연락 주세요.");
      })
      .finally(function () { btn.disabled = false; btn.textContent = "주문 찾기"; });
  }

  $("go").addEventListener("click", lookup);
  ["oid", "ph"].forEach(function (id) {
    $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") lookup(); });
  });
  // 숫자만 남기기(하이픈을 넣어도 통과하게 — 입력 형식에 관대할 것, NN/g 고령 사용자 가이드)
  $("ph").addEventListener("input", function () { this.value = this.value.replace(/[^0-9]/g, "").slice(0, 4); });

  // 문자 링크로 바로 열리는 경우: /order-lookup.html?o=주문번호
  try {
    var q = new URLSearchParams(location.search);
    var pre = q.get("o");
    if (pre) { $("oid").value = pre.toUpperCase(); $("ph").focus(); }
  } catch (_e) {}
})();
</script>
</body>
</html>
