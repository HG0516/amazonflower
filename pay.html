<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>맞춤 결제 — 꽃안부</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/tokens.css">
<script src="https://js.tosspayments.com/v2/standard"></script>
<style>
  /* 맞춤 결제 링크 전용 페이지. 정가 카탈로그(index.html)와 별개 — 관리자가 발급한 링크로 진입.
     금액은 서버에서 HMAC 서명으로 봉인돼 있어(confirm-payment.js) 손님이 못 바꾼다. */
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
       line-height:1.65;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:460px;margin:0 auto;padding:28px 18px 60px;}
  .brand{text-align:center;font-family:var(--font-display);font-size:22px;font-weight:700;color:var(--accent);margin-bottom:4px;}
  .brand small{display:block;font-family:var(--font-body);font-size:12px;color:var(--ink-faint);letter-spacing:.14em;margin-top:4px;font-weight:400;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px 20px;margin-top:18px;}
  .amtcard{text-align:center;}
  .amtcard .lbl{font-size:15px;color:var(--ink-soft);}
  .amtcard .amt{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;}
  .amtcard .amt small{font-size:20px;font-weight:700;}
  .amtcard .oid{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ink-faint);margin-top:8px;}
  label.f{display:block;margin-top:16px;font-size:13px;font-weight:600;color:var(--ink-soft);}
  label.f .opt{color:var(--ink-faint);font-weight:400;}
  input,textarea{width:100%;margin-top:6px;padding:13px;font-size:16px;border:1px solid var(--line);
    border-radius:var(--radius);background:#fcfbf8;font-family:inherit;color:var(--ink);}
  input:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  textarea{resize:vertical;min-height:56px;}
  .btn{width:100%;margin-top:22px;padding:16px;border:none;border-radius:var(--radius);
    background:var(--accent);color:#fff;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;}
  .btn:disabled{opacity:.55;}
  .note{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:14px;}
  .err{display:none;background:#f7e9e7;border:1px solid var(--danger);color:var(--danger);
    border-radius:var(--radius);padding:12px 14px;font-size:14px;margin-top:16px;}
  .center{text-align:center;padding:20px 0;}
  .big{font-size:48px;}
  .spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--accent);
    border-radius:50%;animation:spin 1s linear infinite;display:inline-block;vertical-align:middle;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none;}}
  .receipt{display:inline-block;margin-top:14px;font-size:14px;color:var(--accent);text-decoration:underline;}
  h2{font-family:var(--font-display);font-size:20px;margin:10px 0 4px;}
  .pm{display:grid;gap:8px;margin-top:18px;}
  .pmb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:58px;padding:11px 14px;border:1.5px solid var(--line);border-radius:var(--radius);background:#fff;cursor:pointer;text-align:left;font-family:inherit;}
  .pmb b{font-size:16px;color:var(--ink);} .pmb span{font-size:13px;color:var(--ink-soft);}
  .pmb.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);}
  /* 10/5까지 이 파일엔 .hidden 정의가 없어 '가상계좌' 칸이 스위치와 상관없이 보였다. */
  .hidden{display:none!important;}
  /* 동의 한 번(10/6) — 주문서(index.html)의 필수 동의 4개와 같은 내용을 한 칸으로. 전화로 이미 주문한 손님이라 탭 한 번 */
  .agree1{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#f7f7f3;font-size:14px;line-height:1.6;text-align:left;cursor:pointer;}
  .agree1 input{width:20px;height:20px;flex-shrink:0;margin:2px 0 0;accent-color:var(--accent);}
  .agree1 a{color:var(--ink);font-weight:600;text-decoration:underline;}
  .agree-more{margin-top:6px;font-size:13px;color:var(--ink-soft);text-align:left;}
  .agree-more summary{cursor:pointer;}
  .agree-more p{margin:6px 0 0;line-height:1.7;}
  .paychips{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
  .paychips .pc{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font-size:12px;font-weight:700;font-style:normal;line-height:1.35;white-space:nowrap;}
  .paychips .pc::before{content:"";flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--dot,#8a877d);}
  .paychips .pc-naver{--dot:#03C75A;color:#02803A;border-color:#bfe9cf;background:#f1fbf5;}
  .paychips .pc-kakao{--dot:#FEE500;color:#3C1E1E;border-color:#f2dc54;background:#fffbe0;}
  .paychips .pc-kakao::before{box-shadow:inset 0 0 0 1px rgba(60,30,30,.35);}
  .paychips .pc-toss{--dot:#0064FF;color:#0058E0;border-color:#c6dafc;background:#f2f7ff;}
  .dep{margin-top:16px;padding:14px;border:2px solid var(--accent);border-radius:var(--radius-lg);background:var(--accent-soft);text-align:left;}
  .dep .no{font-size:19px;font-weight:800;margin-top:6px;word-break:break-all;}
  .dep .cp{margin-top:8px;padding:10px 14px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-weight:700;font-family:inherit;cursor:pointer;}
  .dep p{font-size:14px;color:var(--ink-soft);margin:8px 0 0;line-height:1.6;}
</style>
<script src="/footer.js?v=20261004" defer></script>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="brand">꽃안부<small>맞춤 결제</small></div>
  <div id="view"></div>
</div>

<script>
const TOSS_CLIENT_KEY = "live_ck_Poxy1XQL8Rw601W9mEAX37nO5Wml"; // 공개 클라이언트키(결제창) — index.html과 동일
const $ = (id) => document.getElementById(id);
const view = $("view");
const won = (n) => Number(n).toLocaleString() + "원";
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function screenError(msg, sub){
  view.innerHTML = `<div class="card center">
    <div class="big">⚠️</div>
    <h2>${esc(msg)}</h2>
    <p class="note">${esc(sub||"")}</p>
    <p class="note">문의: 꽃안부 1577-2286</p>
  </div>`;
}

// ── 결제 요청 화면 (링크로 처음 진입) ──
let payment = null;
function renderForm(oid, amt, token, label){
  view.innerHTML = `
    <div class="card amtcard">
      <div class="lbl">${esc(label)}</div>
      <div class="amt">${Number(amt).toLocaleString()}<small>원</small></div>
      <div class="oid">주문번호 ${esc(oid)}</div>
    </div>
    <div class="card">
      <label class="f">보내는 분 성함
        <input id="sname" type="text" autocomplete="name" placeholder="예: 홍길동">
      </label>
      <label class="f">연락처
        <input id="sphone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000">
      </label>
      <label class="f">받는 분 <span class="opt">(선택)</span>
        <input id="rname" type="text" placeholder="예: 김영수 / ○○병원 장례식장">
      </label>
      <label class="f">받는 곳 · 희망일 <span class="opt">(선택)</span>
        <input id="rvenue" type="text" placeholder="예: 3호실 · 7/20 오전">
      </label>
      <label class="f">요청사항 <span class="opt">(선택)</span>
        <textarea id="snote" placeholder="리본 문구 등 전하실 말씀"></textarea>
      </label>
      <div class="err" id="err"></div>
      <div id="pm" class="pm">
        <button type="button" class="pmb on" data-m="card"><b>카드 · 간편결제</b><i class="paychips" aria-label="고르실 수 있는 결제수단" style="font-style:normal;"><i class="pc pc-card">신용카드</i><i class="pc pc-naver">네이버페이</i><i class="pc pc-kakao">카카오페이</i><i class="pc pc-toss">토스페이</i></i></button>
        <button type="button" class="pmb hidden" data-m="transfer"><b>계좌이체</b><span>내 은행 계좌에서 바로 이체 · 현금영수증 자동</span></button>
        <button type="button" class="pmb hidden" data-m="va"><b>계좌로 입금(가상계좌)</b><span>이 주문 전용 계좌가 나와요 · 입금되면 자동 확인</span></button>
      </div>
      <label class="agree1"><input type="checkbox" id="agreeAll"><span><b>[필수]</b> 위 주문 내용과 금액을 확인했고, 결제·<a href="/terms.html" target="_blank" rel="noopener">이용약관</a>·<a href="/privacy.html" target="_blank" rel="noopener">개인정보 수집·이용과 처리위탁</a>에 동의합니다</span></label>
      <details class="agree-more"><summary>동의 내용 자세히 보기</summary>
        <p><b>수집 항목</b> 보내는 분 성함·연락처, 받는 분·받는 곳·요청사항(적으신 경우)<br>
        <b>이용 목적</b> 주문 접수·제작·배송, 주문·도착 사진 문자 안내, 결제 확인·환불<br>
        <b>보유 기간</b> 전자상거래법에 따라 계약·결제 기록 5년, 소비자 불만·분쟁 기록 3년 보관 후 파기<br>
        <b>처리위탁</b> 토스페이먼츠(결제) · 솔라피(문자 발송) · 배송 협력 꽃집(제작·배송) · Supabase·Vercel(저장·운영)<br>
        동의하지 않으실 수 있지만, 이 경우 결제하실 수 없어요.</p>
      </details>
      <button class="btn" id="go">${Number(amt).toLocaleString()}원 결제하기</button>
      <p class="note" id="pmNote">결제하기를 누르면 카드·간편결제 창이 열립니다.</p>
    </div>`;

  try{ payment = TossPayments(TOSS_CLIENT_KEY).payment({ customerKey: TossPayments.ANONYMOUS }); }
  catch(e){ console.error(e); }
  // 결제수단은 늘 보인다(카드·간편결제). 계좌이체·가상계좌는 서버 스위치가 켜졌을 때만 버튼이 생긴다.
  // 가상계좌 — 전화 손님에게 링크를 보내면 손님이 계좌로 입금하고, 입금되면 자동으로 접수된다.
  let method = "card";
  const pmBox = $("pm");
  fetch("/api/confirm-payment?config=1", { cache:"no-store" }).then(r => r.ok ? r.json() : null).then(c => {
    if(!c) return;
    if(c.transfer) pmBox.querySelector('[data-m="transfer"]').classList.remove("hidden");
    if(c.virtualAccount) pmBox.querySelector('[data-m="va"]').classList.remove("hidden");
  }).catch(()=>{});
  const PM_GO = { card: Number(amt).toLocaleString()+"원 결제하기", transfer: Number(amt).toLocaleString()+"원 계좌이체하기", va: "입금 계좌 받기" };
  const PM_NOTE = { card: "결제하기를 누르면 카드·간편결제 창이 열립니다.",
    transfer: "누르면 계좌이체 창이 열려요. 은행을 고르고 이체하면 바로 끝나고, 현금영수증도 그 자리에서 신청돼요.",
    va: "누르면 이 주문 전용 입금 계좌가 나와요. 24시간 안에 입금해 주세요." };
  pmBox.querySelectorAll(".pmb").forEach(b => b.onclick = () => {
    method = b.getAttribute("data-m");
    pmBox.querySelectorAll(".pmb").forEach(x => x.classList.toggle("on", x === b));
    $("go").textContent = PM_GO[method] || PM_GO.card;
    $("pmNote").textContent = PM_NOTE[method] || PM_NOTE.card;
  });

  $("go").onclick = async function(){
    const err = $("err"); err.style.display = "none";
    const sname = $("sname").value.trim();
    const sphone = $("sphone").value.trim();
    if(!sname){ err.textContent="보내는 분 성함을 입력해주세요."; err.style.display="block"; $("sname").focus(); return; }
    if(sphone.replace(/\D/g,"").length < 9){ err.textContent="연락처를 정확히 입력해주세요."; err.style.display="block"; $("sphone").focus(); return; }
    if(!$("agreeAll").checked){ err.textContent="주문 내용과 약관에 동의해 주세요. (필수)"; err.style.display="block"; $("agreeAll").focus(); return; }
    if(!payment){ err.textContent="결제 모듈이 준비되지 않았어요. 새로고침 후 다시 시도해주세요."; err.style.display="block"; return; }

    // 주문 정보를 저장 — 결제창→리다이렉트 후 이 값으로 승인 요청한다(index.html과 동일 패턴).
    // customPay/payToken 이 서버 검증의 핵심. 나머지는 주문 기록·사장님 알림용.
    const order = {
      customPay: true,
      payToken: token,
      productLabel: label,
      senderName: sname,
      senderPhone: sphone,
      recipientName: $("rname").value.trim() || null,
      venue: $("rvenue").value.trim() || null,
      senderNote: $("snote").value.trim() || null,
    };
    this.disabled = true; this.textContent = "결제창 여는 중…";
    try{
      // 맞춤결제도 결제창 전에 서버에 주문 원본을 남긴다. 브라우저 저장소가 사라져도
      // 승인 후 주문을 복구할 수 있고, 서명·금액도 출금 전에 한 번 더 검증된다.
      this.textContent = "주문을 안전하게 저장하는 중…";
      const prepRes = await fetch("/api/confirm-payment", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ action:"prepare", orderId:oid, amount:Number(amt), order })
      });
      const prep = await prepRes.json().catch(()=>({}));
      if(!prepRes.ok) throw new Error(prep.error || "주문을 안전하게 저장하지 못했습니다. 잠시 후 다시 시도해주세요.");
      try{ sessionStorage.setItem("afc_"+oid, JSON.stringify(order)); }catch(_){}
      this.textContent = "결제창 여는 중…";
      // 계좌이체·가상계좌: 에스크로(구매안전)는 손님이 결제창에서 고른다. 고르면 토스가 상품 정보를 요구한다.
      const escrowProducts = [{ id: oid, name: String(label).slice(0,100), code: "AFC", unitPrice: Number(amt), quantity: 1 }];
      await payment.requestPayment({
        method: method === "va" ? "VIRTUAL_ACCOUNT" : method === "transfer" ? "TRANSFER" : "CARD",
        ...(method === "va" ? { virtualAccount:{ cashReceipt:{ type:"소득공제" }, validHours:24, escrowProducts } } : {}),
        ...(method === "transfer" ? { transfer:{ cashReceipt:{ type:"소득공제" }, escrowProducts } } : {}),
        amount:{ currency:"KRW", value: Number(amt) },
        orderId: oid,
        orderName: label,
        // 토큰·상품명을 successUrl에도 싣는다 — 리다이렉트 후 sessionStorage가 비어도
        // 결제 승인은 반드시 되게(돈만 빠지고 확인 실패하는 사고 방지). 토큰은 서명값이라 노출 안전.
        successUrl: location.origin + "/pay.html?payresult=success&t=" + encodeURIComponent(token) + "&label=" + encodeURIComponent(label),
        failUrl: location.origin + "/pay.html?payresult=fail",
        customerName: sname,
        customerMobilePhone: sphone.replace(/[^0-9]/g,""),
      });
    }catch(e){
      console.error(e);
      this.disabled = false; this.textContent = Number(amt).toLocaleString()+"원 결제하기";
      err.textContent = e.message || "결제 요청 중 오류가 발생했습니다.";
      err.style.display = "block";
    }
  };
}

// ── 결제 완료 처리 (토스가 successUrl로 리다이렉트) ──
async function handleRedirect(q){
  const r = q.get("payresult");
  if(r === "fail"){
    view.innerHTML = `<div class="card center"><div class="big">❌</div>
      <h2>결제가 취소되었어요</h2>
      <p class="note">${esc(q.get("message")||"결제창이 닫혔거나 실패했습니다.")}</p></div>`;
    return true;
  }
  if(r !== "success") return false;

  const paymentKey = q.get("paymentKey"), orderId = q.get("orderId"), amount = q.get("amount");
  // 새로고침/뒤로가기 재진입 시 승인 재호출 방지
  let done=null; try{ done=JSON.parse(sessionStorage.getItem("afc_done_"+orderId)||"null"); }catch(_){}
  if(done){ renderDone(done); return true; }

  view.innerHTML = `<div class="card center"><span class="spinner"></span> &nbsp;결제를 확인하고 있어요…</div>`;
  let saved={}; try{ saved=JSON.parse(sessionStorage.getItem("afc_"+orderId)||"{}"); }catch(_){}
  // 서버 검증에 꼭 필요한 값은 URL(successUrl에 실어둠)에서 다시 확정한다 — sessionStorage가 비어도 승인되게.
  const urlLabel = q.get("label");
  const order = {
    ...saved,
    customPay: true,
    payToken: q.get("t") || saved.payToken,
    productLabel: (urlLabel != null ? urlLabel : saved.productLabel) || "맞춤 주문",
  };
  try{
    const res = await fetch("/api/confirm-payment", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ paymentKey, orderId, amount:Number(amount), order })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "결제 승인에 실패했습니다.");
    if(!data.manualRecovery) sessionStorage.removeItem("afc_"+orderId);
    const info = { orderId, amount:Number(amount), label:order.productLabel||"맞춤 주문", receipt:(data.payment&&data.payment.receiptUrl)||null, needsReconciliation:!!data.needsReconciliation, manualRecovery:!!data.manualRecovery,
      cashReceipt:(data.payment&&data.payment.cashReceipt&&data.payment.cashReceipt.receiptUrl)||null, escrow:!!(data.payment&&data.payment.useEscrow),
      va: (data.payment && data.payment.status === "WAITING_FOR_DEPOSIT" && data.payment.virtualAccount) || null };
    if(!data.manualRecovery){ try{ sessionStorage.setItem("afc_done_"+orderId, JSON.stringify(info)); }catch(_){} }
    renderDone(info);
  }catch(e){
    view.innerHTML = `<div class="card center"><div class="big">⚠️</div>
      <h2>결제 확인 오류</h2>
      <p class="note">${esc(e.message)}</p>
      <p class="note">결제가 출금됐는데 이 화면이 보이면 꽃안부(1577-2286)로<br>주문번호 <b>${esc(orderId||"")}</b>를 알려주세요.</p>
      <button class="btn" onclick="location.reload()">결제 다시 확인</button></div>`;
  }
  return true;
}

function renderDone(info){
  const va = info.va;
  const due = va && va.dueDate ? (()=>{ const d=new Date(va.dueDate); return isNaN(d) ? "" : (d.getMonth()+1)+"월 "+d.getDate()+"일 "+(d.getHours()<12?"오전 ":"오후 ")+((d.getHours()%12)||12)+"시"+(d.getMinutes()?" "+d.getMinutes()+"분":"")+"까지"; })() : "";
  const depBox = va ? `<div class="dep">
      <div style="font-size:13px;font-weight:700;color:var(--accent-deep);">이 주문 전용 입금 계좌</div>
      <div class="no">${esc(va.bankName||"")} ${esc(va.accountNumber||"")}</div>
      <button class="cp" onclick="try{navigator.clipboard.writeText('${esc((va.bankName||"")+" "+(va.accountNumber||""))}');this.textContent='복사됨 ✓';}catch(e){}">계좌 복사</button>
      <p>금액 <b>${won(info.amount)}</b>${due?` · 기한 <b>${esc(due)}</b>`:""}</p>
      <p>이 계좌로 입금하시면 자동으로 확인되고, 그때부터 준비를 시작합니다.</p>
    </div>` : "";
  view.innerHTML = `<div class="card center">
    <div class="big">${va ? "🧾" : "✅"}</div>
    <h2>${va ? "입금 계좌가 나왔어요" : "결제가 완료됐어요"}</h2>
    ${depBox}
    <div class="amt" style="font-size:26px;font-weight:800;margin-top:6px;">${won(info.amount)}</div>
    <p class="note" style="margin-top:6px;">${esc(info.label)}</p>
    <p class="note">주문번호 ${esc(info.orderId)}</p>
    ${info.manualRecovery
      ? `<p class="note" style="background:#fff0ef;border:1px solid #c84b45;border-radius:8px;padding:10px;color:#7d211d;"><b>결제는 정상 완료됐지만 주문 확인이 필요합니다.</b><br>주문번호를 보관하고 지금 1577-2286으로 알려주세요.</p>`
      : (info.needsReconciliation ? `<p class="note" style="background:#fff7e5;border:1px solid #d29b31;border-radius:8px;padding:10px;color:#6f4a08;"><b>결제는 정상 완료됐습니다.</b><br>주문 저장을 자동으로 다시 확인하고 있어요. 주문번호를 보관해 주세요.</p>` : "")}
    ${info.receipt ? `<a class="receipt" href="${esc(info.receipt)}" target="_blank" rel="noopener">영수증 보기</a>` : ""}
    ${info.cashReceipt ? `<a class="receipt" style="margin-left:12px;" href="${esc(info.cashReceipt)}" target="_blank" rel="noopener">현금영수증</a>` : ""}
    ${info.escrow ? `<p class="note" style="margin-top:10px;">구매안전서비스(에스크로)로 결제됐어요. 꽃이 도착하면 토스페이먼츠 안내에 따라 구매를 확정해 주세요(따로 안 하셔도 며칠 뒤 자동 확정).</p>` : ""}
    <p class="note" style="margin-top:16px;">꽃안부에서 확인 후 준비해 드립니다. 감사합니다 🌸</p>
  </div>`;
}

(async function(){
  const q = new URLSearchParams(location.search);
  if(await handleRedirect(q)) return;

  // 초기 진입: 링크 파라미터 검증
  const oid = q.get("oid") || "";
  const amt = parseInt(q.get("amt"), 10);
  const token = q.get("t") || "";
  const label = (q.get("label") || "맞춤 주문").slice(0, 60);
  if(!/^AFC\d{8}-[0-9A-F]{8}$/.test(oid) || !token){
    return screenError("잘못된 결제 링크예요.", "링크 주소가 올바르지 않습니다. 보내주신 분께 다시 요청해주세요.");
  }
  if(!(Number.isInteger(amt) && amt >= 1000 && amt <= 3000000)){
    return screenError("결제 금액이 올바르지 않아요.", "링크를 다시 확인해주세요.");
  }
  renderForm(oid, amt, token, label);
})();
</script>
</body>
