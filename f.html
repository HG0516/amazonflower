<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- 꽃집 페이지(/f/<가게>). 사장님이 연결하기 전 시험 단계라 검색에 안 잡히게 둔다(robots.txt 에도 /f/ 막음). -->
<meta name="robots" content="noindex,nofollow">
<title>꽃집 페이지 · 꽃안부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
/* 꽃집 페이지 틀 하나. 가게 정보는 /data/shops/<slug>.json 에서 읽는다(11/4 1단계: 서버·DB 없이).
   화환 버튼만 꽃안부 주문으로 가고, 유입 꼬리표(utm_source=shop, utm_campaign=<slug>)로 어느 꽃집 소개인지 센다.
   꽃집 꽃값은 그 가게가 직접 받는다(꽃안부 토스로 남의 꽃값을 받지 않는다).
   예시 가게(sample:true)만 '사장님 화면' 보여 드리기 모드가 있다. 고친 내용은 그 기기 localStorage 에만 남는다(11/4, 2단계에서 서버 저장). */
:root{
  --bg:#fbf8f6; --card:#ffffff; --ink:#3a3340; --muted:#7b7282; --line:#ece4ea;
  --lilac:#b9a3d6; --lilac-soft:#f1ebf8; --peach:#f2c4b4; --peach-soft:#fcefe9; --sage-soft:#eaf1ea;
  --anbu:#2f5d46; --anbu-soft:#e2ede6; --owner:#2b2a33;
  --display:"Gowun Batang",serif; --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.page{max-width:460px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:96px}
img{max-width:100%;display:block}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.35}
p{margin:0}
[hidden]{display:none!important}
button{font:inherit;color:inherit}

/* 위 띠 + 화면 전환 */
.topbar{position:sticky;top:0;z-index:20;background:var(--owner);color:#fff;padding:8px 12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.topbar small{font-size:11.5px;opacity:.8;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.12);border-radius:999px;padding:3px;width:100%;max-width:300px}
.seg button{border:0;background:none;color:#fff;padding:6px 10px;border-radius:999px;font-size:13.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--owner);font-weight:700}

.hero{position:relative}
.hero img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--lilac-soft)}
.head{padding:18px 20px 6px;display:flex;flex-direction:column;gap:6px;position:relative}
.head h1{font-size:27px}
.head .sub{color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tags span{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--lilac-soft);color:#6b5590}
.now{margin:14px 20px 0;border-radius:16px;padding:14px 16px;background:var(--sage-soft);display:flex;gap:12px;align-items:flex-start}
.now .dot{width:10px;height:10px;border-radius:50%;background:#6f9a72;margin-top:7px;flex:none;box-shadow:0 0 0 4px rgba(111,154,114,.2)}
.now b{display:block;font-size:15px}
.now span{font-size:13.5px;color:#55625a}
.now.night{background:var(--lilac-soft)}
.now.night .dot{background:#8b6fc0;box-shadow:0 0 0 4px rgba(139,111,192,.2)}
.cta{display:block;margin:14px 20px 0;background:var(--ink);color:#fff;border-radius:16px;padding:15px;text-align:center;text-decoration:none;font-weight:700;font-size:16px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;margin:10px 20px 0}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:13px;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer}
.quick button i{font-style:normal;font-size:18px}
.best{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:0 20px 4px;scroll-snap-type:x proximity}
.best button{flex:none;width:132px;border:0;background:none;padding:0;text-align:left;cursor:pointer;scroll-snap-align:start;display:flex;flex-direction:column;gap:4px}
.best img{width:132px;height:132px;object-fit:cover;border-radius:16px;background:var(--lilac-soft)}
.best b{font-size:14px}
.best span{font-size:13px;color:var(--muted)}
.item.tap{cursor:pointer}
.vimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;background:var(--lilac-soft)}
.vdesc{color:var(--muted);font-size:14px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--lilac-soft);border-radius:12px;padding:8px 12px;font-size:14px}
.pk button{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-decoration:underline}
.confirm{position:sticky;top:0;z-index:20;background:var(--owner);color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.confirm span{font-size:13px;line-height:1.45}
.confirm button{flex:none;border:0;background:#fff;color:var(--owner);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;cursor:pointer}
.choice{display:flex;flex-direction:column;gap:8px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 14px;font-size:15px;font-weight:700;cursor:pointer}
.choice button small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.quick a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;text-decoration:none;color:var(--ink);font-size:13px;display:flex;flex-direction:column;gap:4px;align-items:center}
.quick a i{font-style:normal;font-size:18px}
section{padding:30px 20px 0;display:flex;flex-direction:column;gap:14px;position:relative}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:20px}
.sec-h small{color:var(--muted);font-size:12.5px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{font-size:13.5px;flex:none;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item .badge{position:absolute;left:8px;top:8px;font-style:normal;font-size:12px;font-weight:700;background:rgba(0,0,0,.62);color:#fff;padding:3px 8px;border-radius:99px}
.item{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;position:relative}
.item img{aspect-ratio:1;object-fit:cover;background:var(--lilac-soft)}
.item .noimg{aspect-ratio:1;background:var(--lilac-soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.item div.t{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.item b{font-size:14.5px}
.item span{font-size:13px;color:var(--muted)}
.item .pr{color:var(--ink);font-size:14px}
.form{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:8px}
.q > label,.q > .lab{font-size:14px;font-weight:700;font-family:var(--display)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{font-size:13.5px;padding:7px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--lilac-soft);border-color:var(--lilac);color:#5a4580;font-weight:700}
.palette{display:flex;gap:26px 12px;flex-wrap:wrap;padding-bottom:16px}
.palette button{width:44px;height:44px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;position:relative;padding:0}
.palette button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.palette button span{position:absolute;left:50%;top:48px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
input[type=date],input[type=time],input[type=number],textarea,input[type=text],input[type=url],select{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--lilac);outline-offset:2px}
.slip{border-radius:16px;background:var(--peach-soft);padding:16px;display:flex;flex-direction:column;gap:8px}
.slip h3{font-size:15.5px}
.slip pre{margin:0;font-family:var(--body);font-size:14px;white-space:pre-wrap;line-height:1.7;background:#fff;border-radius:12px;padding:12px;border:1px dashed var(--peach)}
.slip .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font-size:14.5px;font-weight:700;padding:12px;border-radius:14px;border:0;cursor:pointer;text-align:center;text-decoration:none;display:block}
.btn.kakao{background:#fee500;color:#191919}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--owner);color:#fff}
.btn.danger{background:#fff;color:#b23b3b;border:1px solid #f0d0d0}
.slip small{color:var(--muted);font-size:12.5px}
.toast{font-size:13px;color:#5a7a5c;min-height:1em}
.cls{display:flex;flex-direction:column;gap:8px}
.cls div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative}
.cls b{font-size:14.5px;display:block}
.cls span{font-size:13px;color:var(--muted)}
.how{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px}
.how div{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px}
.how div:last-child{border-bottom:0}
.how div::before{content:attr(data-n);font-family:var(--display);color:var(--lilac);font-size:18px;line-height:1.2}
.wreath{margin:30px 20px 0;border-radius:20px;background:var(--anbu-soft);padding:18px;display:flex;flex-direction:column;gap:12px;border:1px solid #c7dccf;position:relative}
.wreath .top{display:flex;gap:12px;align-items:center}
.wreath img{width:72px;height:72px;border-radius:14px;object-fit:cover;flex:none}
.wreath h2{font-size:18px;color:#1f4232}
.wreath p{font-size:13.5px;color:#3f5547}
.wreath .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wreath a{background:var(--anbu);color:#fff;border-radius:14px;padding:12px 8px;text-align:center;text-decoration:none;font-weight:700;font-size:14px}
.wreath a.alt{background:#fff;color:var(--anbu);border:1px solid #c7dccf}
.wreath small{font-size:12px;color:#5b6f61}
.map{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.map a{color:var(--ink)}
footer{padding:30px 20px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
footer a{color:var(--muted)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(251,248,246,0),var(--bg) 30%);z-index:10}
.dock div{max-width:428px;margin:0 auto;display:grid;grid-template-columns:1fr 1.4fr;gap:8px}
.dock a,.dock button{border-radius:16px;padding:14px;text-align:center;text-decoration:none;font-weight:700;font-size:15px;border:0;cursor:pointer}
.dock .a1{background:#fff;color:var(--ink);border:1px solid var(--line)}
.dock .a2{background:var(--ink);color:#fff}
.missing{padding:80px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.missing a{color:var(--anbu)}

/* ── 사장님 화면 ── */
.owner-panel{padding:16px 16px 4px;display:flex;flex-direction:column;gap:12px;background:#f3f1f6;border-bottom:1px solid var(--line)}
.owner-panel h2{font-size:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats div{background:#fff;border-radius:12px;padding:8px 6px;text-align:center;display:flex;flex-direction:column}
.stats b{font-size:18px;font-variant-numeric:tabular-nums}
.stats small{font-size:11px;color:var(--muted);line-height:1.3}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tools button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 4px;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tools button i{font-style:normal;font-size:17px}
.inbox{display:flex;flex-direction:column;gap:6px}
.inbox .msg{background:#fff;border-radius:12px;padding:10px 12px;font-size:13px;border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.inbox .msg .top{display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.inbox .msg b{font-size:13.5px}
.inbox .msg small{color:var(--muted);font-size:11.5px}
.inbox .msg pre{margin:0;font-family:var(--body);white-space:pre-wrap;font-size:12.5px;color:#57505d;max-height:0;overflow:hidden}
.inbox .msg.open pre{max-height:none}
.inbox .msg .new{font-size:10.5px;background:#e9584b;color:#fff;border-radius:999px;padding:0 6px}
.inbox .empty{font-size:13px;color:var(--muted)}
.note-o{font-size:12px;color:var(--muted)}
.pen{position:absolute;right:10px;top:10px;z-index:3;border:0;background:var(--owner);color:#fff;border-radius:999px;font-size:12px;padding:4px 10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.item .pen{right:6px;top:6px}
.offblock{opacity:.45}
.offtag{font-size:11.5px;background:#ddd;color:#555;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;font-family:var(--body);font-weight:400}
.addcard{border:1.5px dashed var(--lilac);background:var(--lilac-soft);border-radius:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;min-height:180px;cursor:pointer;color:#6b5590;font-size:13.5px}
.addcard i{font-style:normal;font-size:26px}

/* 아래에서 올라오는 편집 창 */
.sheet-bg{position:fixed;inset:0;background:rgba(30,26,34,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:460px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:18px}
.sheet .f{display:flex;flex-direction:column;gap:6px}
.sheet .f > span{font-size:13.5px;font-weight:700}
.sheet .f small{font-size:12px;color:var(--muted)}
.sheet .acts{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;position:sticky;bottom:0;background:#fff;padding-top:6px}
.photo-in{display:flex;gap:10px;align-items:center}
.photo-in img,.photo-in .ph{width:84px;height:84px;border-radius:12px;object-fit:cover;background:var(--lilac-soft);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.photo-in label{flex:1;display:block;text-align:center;padding:12px;border-radius:12px;border:1px dashed var(--lilac);background:var(--lilac-soft);color:#5a4580;font-weight:700;font-size:14px;cursor:pointer}
.photo-in input{position:absolute;opacity:0;width:1px;height:1px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.tg small{display:block;font-size:12px;color:var(--muted)}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;background:#d9d6dd;border-radius:999px;transition:.2s}
.sw span::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked + span{background:var(--anbu)}
.sw input:checked + span::before{transform:translateX(20px)}
.qrwrap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrwrap img{width:200px;height:200px;image-rendering:pixelated;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
.linkbox{display:flex;gap:6px;width:100%}
.linkbox input{flex:1;font-size:13px}
.toastbar{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--owner);color:#fff;font-size:13.5px;border-radius:999px;padding:8px 16px;z-index:50;max-width:90vw;text-align:center}

@media (min-width:700px){body{background:#efe9ee}.dock{background:none}.page{box-shadow:0 0 0 1px var(--line),0 20px 60px -30px rgba(58,51,64,.4)}}
/* PC: 왼쪽에 가게 소개를 붙여 두고 오른쪽에서 둘러본다 */
@media (min-width:1000px){
  .page{max-width:1120px;display:grid;grid-template-columns:360px minmax(0,1fr);gap:0 28px;align-items:start;padding:28px 28px 60px;background:none;box-shadow:none}
  .topbar,.owner-panel,.confirm{grid-column:1/-1;border-radius:16px;margin-bottom:20px}
  .side{position:sticky;top:90px;background:var(--bg);border-radius:24px;overflow:hidden;padding-bottom:22px;box-shadow:0 0 0 1px var(--line)}
  .main{background:var(--bg);border-radius:24px;padding-bottom:30px;box-shadow:0 0 0 1px var(--line)}
  .main > section:first-child{padding-top:24px}
  .menu{grid-template-columns:repeat(3,1fr)}
  .form,.slip,.how,.cls,.map{max-width:600px}
  .wreath{max-width:600px}
  .best{margin:0;padding:0 0 4px}
  .dock{display:none}
  .sheet{border-radius:22px;margin-bottom:8vh}
  .sheet-bg{align-items:center}
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sw span,.sw span::before{transition:none}}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="missing" id="loading"><p>불러오는 중이에요</p></div>
</div>
<div class="dock" id="dock" hidden></div>
<div id="sheetRoot"></div>
<div class="toastbar" id="toastbar" hidden></div>

<script>
(function(){
  "use strict";
  var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
  // 사진 주소는 사이트 안 경로(/...) 또는 사장님이 올린 사진(data:image/...)만 쓴다
  // 사장님이 올린 사진은 shop-photos 버킷(공개)에 있다(2단계).
  var safeImg=function(u){u=String(u||"");return (/^\/[^\s"'<>]*$/.test(u)||/^https:\/\/ivlfwlbwiijhmwsfljzz\.supabase\.co\/storage\/v1\/object\/public\/shop-photos\/[A-Za-z0-9\/_.-]+$/.test(u)||/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u))?u:"";};
  // 주소는 /f/<slug>(vercel rewrite) 또는 /f.html?shop=<slug>
  var m=location.pathname.match(/^\/f\/([a-z0-9-]{1,40})\/?$/);
  var slug=m?m[1]:(new URLSearchParams(location.search).get("shop")||"");
  if(!/^[a-z0-9-]{1,40}$/.test(slug)) return missing();

  var BASE=null, S=null, MODE="guest", FILTER="", PICKED="", CONFIRM=false;
  var ANBU_CHAT="https://pf.kakao.com/_AXXBX/chat";
  var LS_SHOP="f_demo_shop_"+slug, LS_INBOX="f_demo_inbox_"+slug;
  var lsGet=function(k){try{return JSON.parse(localStorage.getItem(k)||"null");}catch(_){return null;}};
  var lsSet=function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(_){return false;}};

  function wire(){
    var s=S;
    document.querySelectorAll("[data-mode]").forEach(function(b){b.addEventListener("click",function(){
      MODE=b.dataset.mode; history.replaceState(null,"",MODE==="owner"?"#owner":location.pathname+location.search); render(); window.scrollTo(0,0);
    });});
    document.querySelectorAll("[data-act]").forEach(function(b){b.addEventListener("click",function(e){e.preventDefault();act(b.dataset.act,b.dataset.arg);});});
    document.querySelectorAll("[data-view]").forEach(function(b){
      var go=function(){ if(MODE!=="owner") sheetView(parseInt(b.dataset.view,10)); };
      b.addEventListener("click",go); b.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} });
    });

  // 올린 사진을 긴 변 900px JPEG 로 줄인다(이 기기 저장 공간을 아끼려고)
  function readPhoto(input,cb){
    var f=input&&input.files&&input.files[0]; if(!f) return cb(null);
    var r=new FileReader();
    r.onload=function(){ var img=new Image(); img.onload=function(){
      var k=Math.min(1,900/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); cb(c.toDataURL("image/jpeg",0.8));
    }; img.onerror=function(){toast("이 사진은 열 수 없어요");cb(null);}; img.src=r.result; };
    r.readAsDataURL(f);
  }
  function livePreview(id){
