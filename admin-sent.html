<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>보낸 꽃 사진 — 꽃안부 관리자</title>
<link rel="stylesheet" href="/tokens.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif);background:var(--bg);color:var(--ink);line-height:1.5;font-size:15px;padding:0 0 40px;word-break:keep-all;}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px;}
  header{text-align:center;padding:18px 0 4px;}
  h1{font-size:20px;font-weight:800;}
  .sub{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;}
  .row-h{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .badge{font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:#f0ece3;color:var(--ink-soft);}
  .badge.on{background:#eaf3ec;color:var(--accent-deep,#1f4733);} .badge.off{background:#fbe9e6;color:#9a3b2e;}
  .hint{font-size:12.5px;color:var(--ink-faint);margin-top:8px;}
  #tgBody p{font-size:13px;color:var(--ink-soft);margin-top:6px;} #tgBody .warn{color:#9a3b2e;}
  .btn{width:100%;padding:13px;font-size:15px;font-weight:800;border:none;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-family:inherit;}
  .btn:disabled{background:var(--ink-faint);}
  .btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .btns .btn{flex:1;}
  .sm{flex:1;font-size:13px;font-weight:700;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .tabs{display:flex;gap:6px;margin:18px 0 4px;}
  .tabs button{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:999px;background:var(--paper);font-size:14px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .it{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:12px;}
  .it.busy{opacity:.55;pointer-events:none;}
  .ph{position:relative;display:block;width:100%;border:0;padding:0;background:#f0ece3;border-radius:8px;overflow:hidden;cursor:pointer;}
  .ph img{display:block;width:100%;max-height:420px;object-fit:contain;background:#f0ece3;}
  .ph span{display:block;padding:40px 0;color:var(--ink-faint);font-size:13px;}
  .ph .done{position:absolute;left:8px;top:8px;font-style:normal;font-size:12px;font-weight:800;background:var(--accent);color:#fff;padding:2px 8px;border-radius:999px;}
  .meta{font-size:12px;color:var(--ink-faint);margin-top:8px;}
  .note{font-size:13px;color:var(--ink-soft);margin-top:4px;}
  .f{display:grid;gap:6px;margin-top:8px;}
  .f input,.f select{width:100%;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fcfbf8;color:var(--ink);font-family:inherit;}
  .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .acts button{flex:1;min-width:70px;font-size:13.5px;font-weight:700;padding:10px 6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;font-family:inherit;color:var(--ink-soft);}
  .acts .go{background:var(--accent);border-color:var(--accent);color:#fff;}
  .acts .del{color:#9a3b2e;flex:0 0 auto;}
  .empty{text-align:center;color:var(--ink-faint);padding:28px 0;font-size:14px;}
  .ed{position:fixed;inset:0;z-index:90;background:#111;display:flex;flex-direction:column;}
  .ed.hidden{display:none;}
  .ed-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;color:#fff;}
  .ed-top button{background:none;border:1px solid #555;color:#fff;border-radius:8px;padding:6px 12px;font-size:14px;font-family:inherit;}
  .ed-hint{color:#ccc;font-size:13px;padding:0 14px 8px;}
  .ed-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0 8px;}
  #edCv{max-width:100%;max-height:100%;touch-action:none;cursor:crosshair;background:#222;}
  .ed-btns{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));}
  .ed-btns button{flex:1;padding:13px 6px;border-radius:10px;border:1px solid #555;background:#222;color:#fff;font-size:14px;font-weight:700;font-family:inherit;}
  .ed-btns .go{background:var(--accent);border-color:var(--accent);}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:14px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;}
  .toast.show{opacity:1;} .toast.err{background:#9a3b2e;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📷 보낸 꽃 사진</h1>
    <div class="sub">텔레그램 주문 알림 방에 올린 사진과 배송완료 사진이 여기 모여요. 리본 이름을 가리고 [공개]를 누르면 상품 화면과 전체 상품 '보낸 꽃'에 보여요.</div>
  </header>

  <div class="card" id="tgCard" data-owner-only>
    <div class="row-h"><b>텔레그램 사진 받기</b><span id="tgBadge" class="badge">확인 중…</span></div>
    <div id="tgBody"></div>
    <div class="btns" id="tgBtns"></div>
  </div>

  <div class="card">
    <button class="btn" id="upBtn" type="button">＋ 사진 여러 장 올리기</button>
    <input type="file" id="files" accept="image/*" multiple hidden />
    <div class="hint" id="upMsg">올린 사진은 후보에 들어가요. 손님에게는 [공개]를 눌러야 보여요.</div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
  <datalist id="pcs"></datalist>
</div>

<div class="ed hidden" id="ed" role="dialog" aria-label="리본 이름 가리기">
  <div class="ed-top"><b>리본 이름 가리기</b><button type="button" onclick="closeEd()">닫기</button></div>
  <div class="ed-hint">이름이 보이는 곳을 손가락으로 대각선으로 쭉 그으면 그 네모가 모자이크돼요. 근조는 리본 전체를 가려 주세요.</div>
  <div class="ed-stage"><canvas id="edCv"></canvas></div>
  <div class="ed-btns">
    <button type="button" onclick="edUndo()">되돌리기</button>
    <button type="button" onclick="edRotate()">↻ 돌리기</button>
    <button type="button" class="go" onclick="edDone()">다 가렸어요</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/admin-auth.js"></script>
<script src="/products.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CAT = { congrats:"축하화환", condolence:"근조화환", orchid:"난", plant:"관엽·식물", basket:"꽃바구니", bouquet:"꽃다발" };
const SRC = { telegram:"텔레그램", admin:"직접 올림", order:"배송완료 사진" };
const PLIST = (typeof PRODUCTS !== "undefined" && Array.isArray(PRODUCTS)) ? PRODUCTS : [];
const PMAP = new Map(PLIST.map(p=>[p.pc, p]));
let ITEMS = [], TAB = "pending", ROLE = "", EDITS = {}, ED = null;

async function api(payload, quiet){
  try{
    const r = await afAdmin.fetch("/api/admin", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ resource:"sent", ...payload }) });
    const d = await r.json().catch(()=>({}));
    if(!r.ok){ if(!quiet) toast("❌ "+(d.error||"오류"),"err"); return null; }
    return d;
  }catch(_){ if(!quiet) toast("❌ 연결이 끊겼어요. 다시 해 주세요.","err"); return null; }
}
async function load(){
  const d = await api({ action:"list" });
  if(!d){ $("list").innerHTML = '<div class="empty">불러오지 못했어요.</div>'; return; }
  ITEMS = d.items || [];
  render();
}
function fmtDay(s){ const m = String(s||"").match(/^\d{4}-(\d{2})-(\d{2})/); return m ? `${+m[1]}/${+m[2]}` : ""; }
function thumb(v){ return EDITS[v.id] || (v.status==="shown" && v.photo_url) || v.raw_url || v.photo_url || ""; }

function render(){
  const n = s => ITEMS.filter(v=>v.status===s).length;
  $("tabs").innerHTML = [["pending","후보"],["shown","공개"],["hidden","숨김"]]
    .map(([k,t])=>`<button type="button" class="${TAB===k?"on":""}" onclick="TAB='${k}';render()">${t} ${n(k)}</button>`).join("");
  const list = ITEMS.filter(v=>v.status===TAB);
  $("list").innerHTML = list.map(card).join("")
    || `<div class="empty">${TAB==="pending" ? "새로 들어온 사진이 없어요." : "사진이 없어요."}</div>`;
}
function card(v){
  const owner = ROLE === "owner", dis = owner ? "" : "disabled";
  const meta = [SRC[v.source]||v.source, fmtDay(v.shot_on||v.created_at), v.order_id ? "주문 "+v.order_id : ""].filter(Boolean).join(" · ");
  const p = PMAP.get(v.product_code);
  const opts = '<option value="">종류 고르기</option>' + Object.entries(CAT).map(([k,t])=>`<option value="${k}" ${v.category===k?"selected":""}>${t}</option>`).join("");
  const canPublish = v.status !== "shown" || EDITS[v.id];
  const acts = owner ? `<div class="acts">
      <button type="button" onclick="openEd('${v.id}')">${v.status==="shown" ? "다시 가리기" : "리본 가리기"}</button>
      ${canPublish ? `<button type="button" class="go" onclick="publish('${v.id}')">${v.status==="shown" ? "다시 공개" : "공개"}</button>` : ""}
      ${v.status!=="hidden" ? `<button type="button" onclick="setStatus('${v.id}','hide')">숨김</button>` : `<button type="button" onclick="setStatus('${v.id}','pending')">후보로</button>`}
      <button type="button" class="del" onclick="del('${v.id}')">삭제</button>
    </div>` : `<div class="hint">공개·숨김은 대표 관리자 계정에서 할 수 있어요.</div>`;
  return `<div class="it" id="it-${v.id}">
    <button type="button" class="ph" onclick="openEd('${v.id}')" ${dis}>
      <img src="${esc(thumb(v))}" alt="" loading="lazy" onerror="this.outerHTML='<span>사진을 못 불러왔어요</span>'">
      ${EDITS[v.id] ? '<i class="done">가림 ✓ 아직 공개 전</i>' : ""}
    </button>
    <div class="meta">${esc(meta)}</div>
    ${v.note ? `<div class="note">“${esc(v.note)}”</div>` : ""}
    <div class="f">
      <input data-k="title" placeholder="사진 이름 (예: 승진 축하 서양란)" value="${esc(v.title||"")}" onchange="saveField('${v.id}',this)" ${dis}>
      <select data-k="category" onchange="saveField('${v.id}',this)" ${dis}>${opts}</select>
      <input data-k="product_code" list="pcs" placeholder="상품 고르기 (누르면 그 상품으로 주문)" value="${esc(v.product_code ? v.product_code+(p?" "+p.name:"") : "")}" onchange="saveField('${v.id}',this)" ${dis}>
      <input data-k="area" placeholder="동네 (예: 서초구) · 근조는 비워 두기" value="${esc(v.area||"")}" onchange="saveField('${v.id}',this)" ${dis}>
    </div>
    ${acts}
  </div>`;
}
function busy(id, on){ const el = $("it-"+id); if(el) el.classList.toggle("busy", !!on); }

async function saveField(id, el){
  const v = ITEMS.find(x=>x.id===id); if(!v) return;
  const k = el.dataset.k, val = el.value.trim(), payload = { action:"save", id };
  let rerender = false;
  if(k === "product_code"){
    const pc = (val.split(/\s+/)[0]||"").toUpperCase(), p = PMAP.get(pc);
    if(val && !p){ toast("상품 목록에서 골라 주세요.","err"); return; }
    payload.product_code = p ? pc : ""; v.product_code = p ? pc : null;
    if(p){
      el.value = pc+" "+p.name;
      if(!v.title){ v.title = [p.name, p.subtitle].filter(Boolean).join(" · "); payload.title = v.title; rerender = true; }
      if(!v.category){ v.category = p.cat; payload.category = p.cat; rerender = true; }
    }
  } else { payload[k] = val; v[k] = val || null; }
  if(k === "category" && val === "condolence" && v.area){ v.area = null; payload.area = ""; rerender = true; }
  const d = await api(payload);
  if(d){ toast("저장 ✓"); if(rerender) render(); }
}
async function setStatus(id, to){
  const v = ITEMS.find(x=>x.id===id); if(!v) return;
  if(v.status==="shown" && !confirm("손님 화면에서 이 사진을 내릴까요?")) return;
  busy(id, true);
  const d = await api({ action: to, id });
  busy(id, false);
  if(!d) return;
  v.status = to==="hide" ? "hidden" : "pending"; render(); toast(to==="hide" ? "숨겼어요" : "후보로 옮겼어요");
}
async function del(id){
  const v = ITEMS.find(x=>x.id===id); if(!v) return;
  if(!confirm(v.source==="order" ? "후보에서 지울까요? (손님에게 보낸 배송완료 사진은 그대로 남아요)" : "이 사진을 지울까요? 되돌릴 수 없어요.")) return;
  busy(id, true);
  const d = await api({ action:"delete", id });
  busy(id, false);
  if(!d) return;
  ITEMS = ITEMS.filter(x=>x.id!==id); delete EDITS[id]; render(); toast("지웠어요");
}
async function publish(id){
  const v = ITEMS.find(x=>x.id===id); if(!v) return;
  if(!v.category){ toast("종류를 먼저 골라 주세요.","err"); return; }
  if(!EDITS[id]){
    const msg = v.category==="condolence"
      ? "근조 사진은 리본 전체를 가려야 해요. 리본이 안 보이는 사진이면 [확인]을 눌러 주세요."
      : "리본 이름을 아직 안 가렸어요. 이름이 안 보이는 사진이면 [확인]을 눌러 그대로 공개해요.";
    if(!confirm(msg)) return;
  }
  busy(id, true);
  let data = EDITS[id];
  if(!data){
    const r = await api({ action:"raw", id });
    if(!r){ busy(id, false); return; }
    data = await shrink(r.dataUrl, 1600).catch(()=>null);
    if(!data){ busy(id, false); toast("사진을 읽지 못했어요.","err"); return; }
  }
  const d = await api({ action:"publish", id, imageBase64:data, title:v.title||"", category:v.category||"", product_code:v.product_code||"", area:v.area||"" });
  busy(id, false);
  if(!d) return;
  v.status = "shown"; if(d.item && d.item.photo_url) v.photo_url = d.item.photo_url;
  delete EDITS[id]; render(); toast("공개했어요 ✓");
}

// ── 사진 여러 장 올리기 ──
$("upBtn").onclick = () => $("files").click();
$("files").addEventListener("change", async e => {
  const files = Array.from(e.target.files || []); e.target.value = "";
  if(!files.length) return;
  $("upBtn").disabled = true;
  let ok = 0;
  for(let i=0; i<files.length; i++){
    $("upMsg").textContent = `${files.length}장 중 ${i+1}장째 올리는 중…`;
    let data = null;
    try{ data = await fileToJpeg(files[i], 1600); }catch(_){ toast("이 사진은 못 읽었어요: "+files[i].name, "err"); continue; }
    const d = await api({ action:"upload", imageBase64:data });
    if(d && d.item){ ITEMS.unshift(d.item); ok++; }
  }
  $("upBtn").disabled = false;
  $("upMsg").textContent = ok ? `${ok}장 올렸어요. 아래 후보에서 리본을 가리고 공개해 주세요.` : "올리지 못했어요. 다시 해 주세요.";
  TAB = "pending"; render();
});
function loadImg(src){ return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; }); }
function toJpeg(im, max){
  const s = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth*s); c.height = Math.round(im.naturalHeight*s);
  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(im, 0, 0, c.width, c.height);
  return canvasJpeg(c);
}
function canvasJpeg(c){ let d = c.toDataURL("image/jpeg", 0.85); if(d.length > 3500000) d = c.toDataURL("image/jpeg", 0.65); return d; }
async function fileToJpeg(file, max){ const u = URL.createObjectURL(file); try{ return toJpeg(await loadImg(u), max); } finally { URL.revokeObjectURL(u); } }
async function shrink(dataUrl, max){ return toJpeg(await loadImg(dataUrl), max); }

// ── 리본 이름 가리기: 손가락으로 네모를 그으면 그 칸을 모자이크 ──
const edCv = $("edCv");
async function openEd(id){
  if(ROLE !== "owner") return;
  const v = ITEMS.find(x=>x.id===id); if(!v) return;
  let src = EDITS[id];
  if(!src){ toast("사진 여는 중…"); const r = await api({ action:"raw", id }); if(!r) return; src = r.dataUrl; }
  let im; try{ im = await loadImg(src); }catch(_){ toast("사진을 읽지 못했어요.","err"); return; }
  const s = Math.min(1, 1600/Math.max(im.naturalWidth, im.naturalHeight));
  edCv.width = Math.round(im.naturalWidth*s); edCv.height = Math.round(im.naturalHeight*s);
  edCv.getContext("2d").drawImage(im, 0, 0, edCv.width, edCv.height);
  ED = { id, hist:[], drag:null };
  $("ed").classList.remove("hidden"); document.body.style.overflow = "hidden";
}
function closeEd(){ $("ed").classList.add("hidden"); document.body.style.overflow = ""; ED = null; }
function pt(e){ const r = edCv.getBoundingClientRect(); return { x:(e.clientX-r.left)*edCv.width/r.width, y:(e.clientY-r.top)*edCv.height/r.height }; }
edCv.addEventListener("pointerdown", e => {
  if(!ED) return; e.preventDefault();
  try{ edCv.setPointerCapture(e.pointerId); }catch(_){}
  ED.drag = { a:pt(e), snap:edCv.getContext("2d").getImageData(0, 0, edCv.width, edCv.height) };
});
edCv.addEventListener("pointermove", e => {
  if(!ED || !ED.drag) return;
  const b = pt(e), a = ED.drag.a, x = edCv.getContext("2d");
  x.putImageData(ED.drag.snap, 0, 0);
  x.lineWidth = Math.max(3, edCv.width/200); x.strokeStyle = "#e0245e"; x.setLineDash([12, 8]);
  x.strokeRect(a.x, a.y, b.x-a.x, b.y-a.y); x.setLineDash([]);
});
function edUp(e){
  if(!ED || !ED.drag) return;
  const b = pt(e), a = ED.drag.a, x = edCv.getContext("2d");
  x.putImageData(ED.drag.snap, 0, 0);
  const rx = Math.max(0, Math.min(a.x, b.x)), ry = Math.max(0, Math.min(a.y, b.y));
  const rw = Math.min(edCv.width, Math.max(a.x, b.x)) - rx, rh = Math.min(edCv.height, Math.max(a.y, b.y)) - ry;
  if(rw > 8 && rh > 8){ ED.hist.push(ED.drag.snap); if(ED.hist.length > 6) ED.hist.shift(); pixelate(x, rx, ry, rw, rh); }
  ED.drag = null;
}
edCv.addEventListener("pointerup", edUp);
edCv.addEventListener("pointercancel", edUp);
function pixelate(x, rx, ry, rw, rh){
  rx = Math.floor(rx); ry = Math.floor(ry); rw = Math.ceil(rw); rh = Math.ceil(rh);
  const n = Math.max(16, Math.round(Math.min(rw, rh)/2.5));
  const sw = Math.max(1, Math.round(rw/n)), sh = Math.max(1, Math.round(rh/n));
  const t = document.createElement("canvas"); t.width = sw; t.height = sh;
  t.getContext("2d").drawImage(x.canvas, rx, ry, rw, rh, 0, 0, sw, sh);
  x.imageSmoothingEnabled = false; x.drawImage(t, 0, 0, sw, sh, rx, ry, rw, rh); x.imageSmoothingEnabled = true;
}
function edUndo(){ if(!ED || !ED.hist.length) return; edCv.getContext("2d").putImageData(ED.hist.pop(), 0, 0); }
function edRotate(){
  if(!ED) return;
  const t = document.createElement("canvas"); t.width = edCv.height; t.height = edCv.width;
  const x = t.getContext("2d"); x.translate(t.width, 0); x.rotate(Math.PI/2); x.drawImage(edCv, 0, 0);
  edCv.width = t.width; edCv.height = t.height; edCv.getContext("2d").drawImage(t, 0, 0);
  ED.hist = [];
}
function edDone(){
  if(!ED) return;
  EDITS[ED.id] = canvasJpeg(edCv);
  closeEd(); render(); toast("가렸어요 ✓ 이제 [공개]를 누르세요");
}

// ── 텔레그램 연결 ──
async function tgLoad(){
  if(ROLE !== "owner") return;
  const d = await api({ action:"tg-status" }, true), t = d && d.tg;
  const badge = $("tgBadge"), body = $("tgBody"), btns = $("tgBtns");
  badge.className = "badge";
  if(!t){ badge.textContent = "확인 못 함"; body.innerHTML = "<p>잠시 후 다시 열어 주세요.</p>"; btns.innerHTML = ""; return; }
  if(!t.ready){ badge.textContent = "키 없음"; body.innerHTML = "<p>텔레그램 알림 키가 없어서 켤 수 없어요.</p>"; btns.innerHTML = ""; return; }
  const room = t.chatTitle ? `'${esc(t.chatTitle)}' 방` : "주문 알림 방";
  const bot = t.bot ? "@"+esc(t.bot) : "알림 봇";
  if(!t.connected){
    badge.textContent = "꺼짐"; badge.classList.add("off");
    body.innerHTML = (t.otherHost ? `<p class="warn">이 봇은 지금 다른 곳(${esc(t.otherHost)})으로 연결돼 있어요. 다른 프로그램이 쓰는 봇이면 켜지 마세요.</p>` : "")
      + `<p>켜면 ${room}에 올린 꽃 사진이 여기 후보로 들어와요. 아차에서 쓰는 봇과 같은 봇(${bot})이면 켜지 마세요.</p>`;
    btns.innerHTML = `<button type="button" class="btn" onclick="tgConnect()">사진 받기 켜기</button>`;
    return;
  }
  badge.textContent = "켜짐"; badge.classList.add("on");
  const all = t.chatType === "private" || t.readsAll || t.botAdmin;
  body.innerHTML = `<p>${room}에 올린 사진이 여기로 들어와요.</p>`
    + (all ? "<p>방에 그냥 올린 사진도 다 받아요.</p>"
           : `<p class="warn">지금은 주문 알림에 <b>답장</b>으로 보낸 사진만 받아요. 방에 그냥 올린 사진까지 받으려면 텔레그램에서 방 이름 누르기 → 편집 → 관리자 → 관리자 추가 → ${bot} 를 넣어 주세요.</p>`)
    + (t.lastError ? `<p class="warn">최근 오류: ${esc(t.lastError)}</p>` : "")
    + (t.pending > 0 ? `<p>받는 중인 사진 ${t.pending}장</p>` : "");
  btns.innerHTML = `<button type="button" class="sm" onclick="tgLoad()">다시 확인</button><button type="button" class="sm" onclick="tgOff()">끄기</button>`;
}
async function tgConnect(){
  if(!confirm("텔레그램 사진 받기를 켤까요? 주문 알림 방에 안내 메시지가 하나 올라가요.")) return;
  const d = await api({ action:"tg-connect" });
  if(d){ toast("켰어요 ✓"); tgLoad(); }
}
async function tgOff(){
  if(!confirm("텔레그램 사진 받기를 끌까요? 끄면 방에 올린 사진이 여기로 안 들어와요.")) return;
  const d = await api({ action:"tg-disconnect" });
  if(d){ toast("껐어요"); tgLoad(); }
}

let toastT = null;
function toast(msg, type){ const t = $("toast"); t.textContent = msg; t.className = "toast show"+(type==="err"?" err":""); clearTimeout(toastT); toastT = setTimeout(()=>t.className="toast", 2400); }

$("pcs").innerHTML = PLIST.map(p=>`<option value="${esc(p.pc+" "+p.name+(p.subtitle?" · "+p.subtitle:""))}"></option>`).join("");
afAdmin.ready.then(a => { if(!a) return; ROLE = a.role || ""; load(); tgLoad(); });
</script>
